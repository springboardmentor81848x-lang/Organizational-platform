<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Trainer / Mentor Dashboard | Workforce Intelligence</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-role="TRAINER_MENTOR">
<div id="app" hidden>
  <header class="topbar">
    <div class="logo"><span>WKI</span><div>Workforce<br>Intelligence</div></div>
    <div class="who">
      <div><strong id="userName"></strong><small id="userEmail"></small></div>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="content">
    <h2>Trainer / Mentor Dashboard</h2>
    <span class="badge">Trainer / Mentor</span>
    <div class="grid">
      <div class="tile"><h3>My Mentees</h3><p>Mentorships you are part of.</p></div>
      <div class="tile"><h3>Sessions</h3><p>Schedule and run knowledge-sharing sessions.</p></div>
      <div class="tile"><h3>Feedback</h3><p>Review mentee progress.</p></div>
    </div>
  </main>
</div>
<script src="js/guard.js"></script>
</body>
</html>
