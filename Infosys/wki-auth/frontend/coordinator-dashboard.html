<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Learning Coordinator Dashboard | Workforce Intelligence</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-role="TRAINING_COORDINATOR">
<div id="app" hidden>
  <header class="topbar">
    <div class="logo"><span>WKI</span><div>Workforce<br>Intelligence</div></div>
    <div class="who">
      <div><strong id="userName"></strong><small id="userEmail"></small></div>
      <button class="logout" id="logoutBtn">Logout</button>
    </div>
  </header>

  <main class="content">
    <h2>Learning Coordinator Dashboard</h2>
    <span class="badge">Learning Coordinator</span>
    <div class="grid">
      <div class="tile"><h3>Training Programs</h3><p>Create and manage programs.</p></div>
      <div class="tile"><h3>Learning Paths</h3><p>Sequence trainings into paths.</p></div>
      <div class="tile"><h3>Enrollments</h3><p>Track who is enrolled and completed.</p></div>
    </div>
  </main>
</div>
<script src="js/guard.js"></script>
</body>
</html>
