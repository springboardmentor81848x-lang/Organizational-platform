<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Workforce Intelligence</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
  <aside class="brand">
    <div class="logo"><span>WKI</span><div>Workforce<br>Intelligence</div></div>
    <h1>Build Better Teams, <em>Sharper Skills</em></h1>
    <p>Identify skill gaps, track learning progress and unlock your team's full potential.</p>
  </aside>

  <main class="panel">
    <form class="card" id="loginForm" novalidate>
      <h2>Welcome Back!</h2>
      <p class="sub">Sign in to your account to continue</p>

      <div class="tabs">
        <a class="tab active" href="login.html">Login</a>
        <a class="tab" href="register.html">Register</a>
      </div>

      <label for="email">Email Address</label>
      <input type="email" id="email" placeholder="Enter your email" autocomplete="username" required>

      <label for="password">Password</label>
      <div class="pw">
        <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required>
        <button type="button" class="eye" data-target="password" aria-label="Show or hide password">👁</button>
      </div>
      <a href="#" class="forgot">Forgot Password?</a>

      <div id="msg" class="msg" role="alert"></div>
      <button type="submit" class="btn">Login →</button>

      <div class="or"><span>or</span></div>
      <button type="button" class="btn-outline">Continue with Google</button>
      <p class="foot">Don't have an account? <a href="register.html">Register</a></p>
    </form>
  </main>
</div>
<script src="js/auth.js"></script>
</body>
</html>
