<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Manager Dashboard | Workforce Intelligence</title>
<meta name="description" content="Manager dashboard to monitor team skills, track training progress, identify skill gaps, and recommend learning paths for your team.">
<style>
  /* ===== DESIGN TOKENS ===== */
  :root {
    --brand: #4f46e5; --brand-dark: #3b32c4; --brand-light: #ede9fe;
    --nav: #1e1b6e; --ink: #1b1750; --muted: #6b6a8a;
    --bg: #f3f5ff; --card: #ffffff; --line: #e1e3f5;
    --ok: #1a7f37; --ok-bg: #e4f6ea;
    --warn: #9a6700; --warn-bg: #fff3d1;
    --bad: #c0262d; --bad-bg: #fde6e7;
    --info-bg: #e9e8fd;
    --accent1: #7c3aed; --accent2: #0ea5e9; --accent3: #f59e0b;
    --accent4: #10b981; --accent5: #ef4444; --accent6: #8b5cf6;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #9d98ff; outline-offset: 2px; }

  /* ===== TOP HEADER ===== */
  .top {
    background: var(--nav); color: #fff;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 28px; gap: 16px;
    box-shadow: 0 2px 16px rgba(30,27,110,.3);
  }
  .brand { display: flex; align-items: center; gap: 12px; font-size: 17px; line-height: 1.2; }
  .logo-box { background: var(--brand); border-radius: 10px; padding: 12px 10px; font-weight: 700; letter-spacing: .5px; }
  .top .right { display: flex; align-items: center; gap: 16px; }
  .who { text-align: right; line-height: 1.2; }
  .who small { display: block; opacity: .75; font-size: 12px; }
  .role-badge { background: rgba(255,255,255,.18); border-radius: 20px; padding: 4px 12px; font-size: 11px; font-weight: 700; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }

  /* ===== BUTTONS ===== */
  .btn { background: var(--brand); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; cursor: pointer; font-weight: 600; transition: background .15s, transform .1s; }
  .btn:hover { background: var(--brand-dark); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: #fff; color: var(--brand); border: 1px solid var(--brand); }
  .btn.ghost:hover { background: var(--brand-light); }
  .btn.danger { background: #fff; color: var(--bad); border: 1px solid #e9a6a9; }
  .btn.danger:hover { background: var(--bad-bg); }
  .btn.small { padding: 5px 11px; font-size: 13px; }
  .btn.outline-nav { background: transparent; border: 1px solid rgba(255,255,255,.3); color: #fff; padding: 8px 16px; font-size: 13px; }
  .btn.outline-nav:hover { background: rgba(255,255,255,.12); }

  /* ===== LAYOUT ===== */
  .layout { display: grid; grid-template-columns: 240px 1fr; gap: 24px; max-width: 1360px; margin: 0 auto; padding: 24px 20px 60px; }

  /* ===== SIDEBAR NAV ===== */
  nav#nav { display: flex; flex-direction: column; gap: 4px; position: sticky; top: 16px; align-self: start; }
  .nav-section-label { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); padding: 10px 14px 4px; margin-top: 8px; }
  nav#nav button { text-align: left; background: transparent; border: 0; padding: 10px 14px; border-radius: 10px; cursor: pointer; color: var(--ink); font-weight: 500; display: flex; align-items: center; gap: 10px; transition: background .12s; }
  nav#nav button:hover { background: #e7e8fb; }
  nav#nav button[aria-current="page"] { background: var(--brand); color: #fff; }
  nav#nav button svg { flex-shrink: 0; }

  main { min-width: 0; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  h2 { margin: 0 0 12px; font-size: 18px; }
  h3 { margin: 0 0 8px; font-size: 15px; }
  p.lead { margin: 0 0 20px; color: var(--muted); }

  /* ===== CARDS ===== */
  .card { background: var(--card); border-radius: 14px; padding: 20px; box-shadow: 0 4px 20px rgba(40,30,140,.07); margin-bottom: 18px; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .card-header h2 { margin: 0; }

  /* ===== STAT TILES ===== */
  .stats-grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 18px; }
  .stat-tile { background: var(--card); border-radius: 14px; padding: 18px 20px; box-shadow: 0 4px 20px rgba(40,30,140,.07); position: relative; overflow: hidden; border-left: 4px solid transparent; }
  .stat-tile.accent-purple { border-left-color: var(--accent1); }
  .stat-tile.accent-blue   { border-left-color: var(--accent2); }
  .stat-tile.accent-amber  { border-left-color: var(--accent3); }
  .stat-tile.accent-green  { border-left-color: var(--accent4); }
  .stat-tile.accent-red    { border-left-color: var(--accent5); }
  .stat-tile b { display: block; font-size: 32px; line-height: 1.1; font-weight: 700; }
  .stat-tile span { color: var(--muted); font-size: 13px; }
  .stat-tile .tile-icon { position: absolute; right: 14px; top: 14px; opacity: .12; font-size: 36px; line-height: 1; }

  /* ===== GRIDS ===== */
  .g2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; }
  .g3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px; }

  /* ===== TABLE ===== */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; }
  tr:last-child td { border-bottom: 0; }
  tr:hover td { background: #f8f8ff; }

  /* ===== MISC ===== */
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .row .grow { flex: 1; min-width: 180px; }
  .sub { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--info-bg); color: var(--brand-dark); }
  .chip.ok   { background: var(--ok-bg);   color: var(--ok);   }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad  { background: var(--bad-bg);  color: var(--bad);  }
  .empty { text-align: center; padding: 32px 16px; color: var(--muted); }

  /* ===== PROGRESS BAR ===== */
  .bar { height: 8px; background: #e7e8fb; border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .4s; }

  /* ===== GAP BAR ===== */
  .gapbar { position: relative; height: 12px; background: #e7e8fb; border-radius: 999px; }
  .gapbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand); border-radius: 999px; }
  .gapbar > u { position: absolute; top: -4px; bottom: -4px; width: 3px; background: #ff7a45; text-decoration: none; border-radius: 2px; }

  /* ===== AVATAR ===== */
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px; color: #fff; flex-shrink: 0; }

  /* ===== SEARCH ===== */
  .search-box { position: relative; }
  .search-box input { width: 100%; padding: 10px 10px 10px 38px; border: 1px solid var(--line); border-radius: 10px; background: #fff; font-size: 14px; transition: border-color .15s; }
  .search-box input:focus { border-color: var(--brand); outline: none; }
  .search-box svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }

  /* ===== MODAL ===== */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
  .modal { background: #fff; border-radius: 16px; padding: 28px; max-width: 680px; width: 100%; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,.25); animation: slideIn .2s ease; }
  @keyframes slideIn { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-header h2 { margin: 0; }
  .modal-close { background: none; border: 0; font-size: 22px; cursor: pointer; color: var(--muted); padding: 4px 8px; border-radius: 6px; }
  .modal-close:hover { background: #f3f5ff; color: var(--ink); }

  /* ===== FILTER BAR ===== */
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; }
  .filter-bar select, .filter-bar input { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 13px; }
  .filter-bar select:focus, .filter-bar input:focus { border-color: var(--brand); outline: none; }

  /* ===== TRAINING CARD ===== */
  .rec-card { border: 1px solid var(--line); border-radius: 12px; padding: 16px; transition: box-shadow .15s, transform .15s; margin-bottom: 12px; }
  .rec-card:hover { box-shadow: 0 6px 20px rgba(79,70,229,.12); transform: translateY(-1px); }
  .rec-card h3 { margin: 0 0 6px; font-size: 15px; }
  .rec-card .meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .rec-card .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .priority-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 4px; }
  .priority-high   { background: var(--bad); }
  .priority-medium { background: var(--accent3); }
  .priority-low    { background: var(--accent4); }

  /* ===== SKILL DOTS ===== */
  .skill-dots { display: inline-flex; gap: 4px; }
  .skill-dot { width: 10px; height: 10px; border-radius: 50%; background: #e1e3f5; }
  .skill-dot.filled { background: var(--brand); }
  .skill-dot.gap    { background: #ffb347; }

  /* ===== SECTION HEAD ===== */
  .section-head { margin-bottom: 20px; }
  .section-head h1 { margin: 0 0 4px; }
  .section-head p  { margin: 0; color: var(--muted); font-size: 14px; }

  /* ===== TOAST ===== */
  #toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); background: #1b1750; color: #fff; padding: 11px 18px; border-radius: 10px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw; z-index: 200; font-size: 14px; }
  #toast.show { opacity: 1; }
  #toast.err  { background: var(--bad); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; padding: 16px; }
    nav#nav { flex-direction: row; flex-wrap: nowrap; overflow-x: auto; position: static; padding-bottom: 8px; gap: 4px; }
    nav#nav button { white-space: nowrap; flex-shrink: 0; }
    .nav-section-label { display: none; }
    .stats-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 520px) {
    .top { padding: 12px 14px; }
    .who small, .role-badge { display: none; }
    .stats-grid { grid-template-columns: 1fr 1fr; }
  }
  @media print {
    .top, nav#nav, .noprint, #toast, .modal-overlay { display: none !important; }
    .layout { display: block; padding: 0; }
    .card, .stat-tile { box-shadow: none; border: 1px solid #ccc; }
    body { background: #fff; }
  }
</style>
</head>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r) => (r||document).querySelector(s);
const $$ = (s, r) => [...(r||document).querySelectorAll(s)];
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
const fmt = (dt) => {
  if (!dt) return "-";
  const d = new Date(dt); if (isNaN(d)) return "-";
  return d.toLocaleDateString([], { dateStyle: "medium" });
};

function getSession() {
  try { return JSON.parse(localStorage.getItem("wki_session") || "null"); } catch { return null; }
}
function goLogin() { localStorage.removeItem("wki_session"); window.location.replace("login.html"); }
function toast(msg, isErr) {
  const t = $("#toast"); t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.className = "", 3200);
}

/* ====== AVATAR ====== */
const COLORS = ["#4f46e5","#7c3aed","#0ea5e9","#10b981","#f59e0b","#ef4444","#8b5cf6","#06b6d4"];
function ac(name) { let h=0; for(let c of String(name||"X")) h=(h*31+c.charCodeAt(0))&0xffffffff; return COLORS[Math.abs(h)%COLORS.length]; }
function ini(name) { const p=String(name||"?").trim().split(/\s+/); return (p[0]?.[0]||"?").toUpperCase()+(p[1]?.[0]||"").toUpperCase(); }
function av(name, size) { size=size||36; return `<span class="avatar" style="background:${ac(name)};width:${size}px;height:${size}px;font-size:${Math.round(size*0.38)}px">${esc(ini(name))}</span>`; }

function gapDots(cur, req, max) {
  max=max||5;
  return `<span class="skill-dots">${Array.from({length:max},(_,i)=>{
    let cls=""; if(i<cur) cls=" filled"; else if(i<req) cls=" gap";
    return `<span class="skill-dot${cls}"></span>`;
  }).join("")}</span>`;
}

/* ====== STATE ====== */
var S = null;
var currentView = "overview";

function computeSummary() {
  var emp = S.employees;
  S.summary = {
    totalEmployees: emp.length,
    avgGapScore: +(emp.reduce((a,e)=>a+e.gaps,0)/emp.length).toFixed(1),
    trainingCompletion: Math.round(emp.reduce((a,e)=>a+e.training,0)/emp.length),
    criticalGaps: emp.filter(e=>e.gaps>=3).length,
    onTrack: emp.filter(e=>e.gaps<=1&&e.training>=70).length,
    needsAttention: emp.filter(e=>e.gaps>=3||e.training<30).length
  };
}

/* ====== NAV ====== */
function renderNav() {
  $$("nav#nav button[data-act='go']").forEach(btn => {
    btn.removeAttribute("aria-current");
    if (btn.dataset.view === currentView) btn.setAttribute("aria-current","page");
  });
}

/* ====== GAP ROW HTML ====== */
function renderGapRows(severity) {
  var data = severity==="all" ? S.skillGaps : S.skillGaps.filter(g=>g.severity===severity);
  if (!data.length) return '<tr><td colspan="7" class="empty">No gaps match the filter.</td></tr>';
  return data.map(g => {
    var gap = (g.required - g.teamAvg).toFixed(1);
    var cc = g.severity==="high"?"bad":g.severity==="medium"?"warn":"ok";
    var label = g.severity==="high"?"&#128308; High":g.severity==="medium"?"&#128993; Medium":"&#128994; Low";
    return '<tr><td><strong>'+esc(g.skill)+'</strong></td><td>'+esc(g.category)+'</td>'
      +'<td>'+gapDots(Math.round(g.teamAvg),g.required)+' <span style="font-size:12px">'+g.teamAvg+'/5</span></td>'
      +'<td>'+g.required+'/5</td>'
      +'<td style="font-weight:700;color:var(--'+(g.severity==="high"?"bad":g.severity==="medium"?"warn":"ok")+')">'+gap+'</td>'
      +'<td><div style="display:flex;align-items:center;gap:8px"><div class="bar" style="width:80px"><i style="width:'+pct(g.employeesGap,S.summary.totalEmployees)+'%"></i></div><span style="font-size:12px">'+g.employeesGap+'/'+S.summary.totalEmployees+'</span></div></td>'
      +'<td><span class="chip '+cc+'">'+label+'</span></td></tr>';
  }).join("");
}

/* ====== EMPLOYEE MODAL ====== */
function showEmployeeModal(id) {
  var emp = S.employeeDetails && S.employeeDetails[id];

  if (!emp && !basic) { toast("Employee details not available", true); return; }
  var e = emp || basic;
  var skills = (emp && emp.skills) || [];
  var courses = (emp && emp.courses) || [];
  $("#modalTitle").textContent = e.name;
  var html = '<div style="display:flex;align-items:center;gap:14px;margin-bottom:20px">'+av(e.name,52)+'<div><div style="font-size:18px;font-weight:700">'+esc(e.name)+'</div><div class="sub">'+esc(e.role||basic.role)+' &middot; '+esc(e.dept||e.department||basic.department)+'</div><span class="chip '+(((e.status||basic.status)==="ACTIVE")?"ok":(e.status||basic.status)==="ON_LEAVE"?"warn":"bad")+'" style="margin-top:4px">'+esc(e.status||basic.status)+'</span></div></div>';
  html += '<div class="g2" style="margin-bottom:16px">';
  if (e.email) html += '<div><div class="sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Email</div><div style="font-size:13px">'+esc(e.email)+'</div></div>';
  if (e.phone) html += '<div><div class="sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Phone</div><div style="font-size:13px">'+esc(e.phone)+'</div></div>';
  if (e.location) html += '<div><div class="sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Location</div><div style="font-size:13px">'+esc(e.location)+'</div></div>';
  if (e.joinDate) html += '<div><div class="sub" style="font-size:11px;text-transform:uppercase;letter-spacing:.5px">Joined</div><div style="font-size:13px">'+fmt(e.joinDate)+'</div></div>';
  html += '</div>';
  if (skills.length) {
    html += '<h3 style="margin-bottom:10px">Skills &amp; Gaps</h3><div style="display:grid;gap:10px;margin-bottom:16px">';
    html += skills.map(s=>{
      var gap=s.required-s.level;
      return '<div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px"><span style="font-weight:600">'+esc(s.name)+'</span><span class="sub">'+s.level+'/'+s.required+(gap>0?' <span style="color:var(--bad);font-weight:700">gap: '+gap+'</span>':' &#10004;')+'</span></div><div class="gapbar"><i style="width:'+s.level/5*100+'%"></i><u style="left:calc('+s.required/5*100+'% - 1px)"></u></div></div>';
    }).join("") + '</div>';
  }
  if (courses.length) {
    html += '<h3 style="margin-bottom:10px">Current Training</h3><div style="display:grid;gap:8px">';
    html += courses.map(c=>{
      var tc=c.progress>=70?"ok":c.progress>=40?"warn":"bad";
      return '<div style="display:flex;align-items:center;gap:10px"><div style="flex:1"><div style="font-size:13px;font-weight:600">'+esc(c.title)+'</div><div class="bar" style="margin-top:4px"><i style="width:'+c.progress+'%" class="'+tc+'"></i></div></div><span style="font-size:12px;font-weight:600;min-width:40px">'+c.progress+'%</span><span class="chip '+(c.status==="COMPLETED"?"ok":"warn")+'">'+( c.status==="COMPLETED"?"Done":"Active")+'</span></div>';
    }).join("") + '</div>';
  } else { html += '<div class="empty sub" style="padding:12px 0">No active training enrolled.</div>'; }
  html += '<div style="margin-top:20px"><button class="btn ghost small" onclick="closeModal()">Close</button></div>';
  $("#modalBody").innerHTML = html;
  $("#empModal").hidden = false;
}

/* ====== CHARTS ====== */
function drawDonut(id, segments) {
  var c = document.getElementById(id); if(!c) return;
  var ctx = c.getContext("2d"), cx=c.width/2, cy=c.height/2, r=Math.min(cx,cy)-10;
  ctx.clearRect(0,0,c.width,c.height);
  var total = segments.reduce((a,s)=>a+s.value,0); if(!total) return;
  var start = -Math.PI/2;
  segments.forEach(seg=>{
    var angle = (seg.value/total)*2*Math.PI;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,r,start,start+angle); ctx.closePath();
    ctx.fillStyle=seg.color; ctx.fill(); start+=angle;
  });
  ctx.beginPath(); ctx.arc(cx,cy,r*0.55,0,2*Math.PI); ctx.fillStyle="#fff"; ctx.fill();
  ctx.fillStyle="#1b1750"; ctx.font="bold 22px 'Segoe UI',sans-serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.fillText(total,cx,cy-8); ctx.font="12px 'Segoe UI',sans-serif"; ctx.fillStyle="#6b6a8a"; ctx.fillText("employees",cx,cy+10);
}

function drawBar(id, labels, values, colors) {
  var c = document.getElementById(id); if(!c) return;
  var ctx=c.getContext("2d"), W=c.width, H=c.height;
  ctx.clearRect(0,0,W,H);
  var pad={top:20,right:16,bottom:50,left:36};
  var cW=W-pad.left-pad.right, cH=H-pad.top-pad.bottom;
  var maxV=Math.max(...values,1);
  var bW=Math.floor(cW/labels.length*0.55), gap=Math.floor(cW/labels.length*0.45);
  ctx.strokeStyle="#e1e3f5"; ctx.lineWidth=1;
  for(var i=0;i<=4;i++){
    var y=pad.top+cH-(i/4)*cH;
    ctx.beginPath(); ctx.moveTo(pad.left,y); ctx.lineTo(pad.left+cW,y); ctx.stroke();
    ctx.fillStyle="#6b6a8a"; ctx.font="11px 'Segoe UI',sans-serif"; ctx.textAlign="right";
    ctx.fillText(Math.round(maxV*i/4),pad.left-4,y+4);
  }
  labels.forEach((lbl,i)=>{
    var x=pad.left+i*(bW+gap)+gap/2;
    var bh=(values[i]/maxV)*cH, y=pad.top+cH-bh;
    ctx.beginPath(); ctx.rect(x,y,bW,bh); ctx.fillStyle=colors[i%colors.length]; ctx.fill();
    ctx.fillStyle="#1b1750"; ctx.textAlign="center"; ctx.font="bold 11px 'Segoe UI',sans-serif";
    ctx.fillText(values[i],x+bW/2,y-5);
    var words=lbl.split(" ");
    ctx.fillStyle="#6b6a8a"; ctx.font="10px 'Segoe UI',sans-serif";
    words.slice(0,2).forEach((w,wi)=>ctx.fillText(w,x+bW/2,pad.top+cH+14+wi*13));
  });
}

function drawRadar(id, labels, values, max) {
  var c=document.getElementById(id); if(!c) return;
  var ctx=c.getContext("2d"), W=c.width, H=c.height;
  ctx.clearRect(0,0,W,H);
  var cx=W/2, cy=H/2, r=Math.min(cx,cy)-42, n=labels.length, a0=-Math.PI/2;
  function pt(i,val){ var a=a0+(i/n)*2*Math.PI, d=(val/max)*r; return [cx+d*Math.cos(a),cy+d*Math.sin(a)]; }
  [0.25,0.5,0.75,1].forEach(f=>{
    ctx.beginPath();
    for(var i=0;i<n;i++){ var [x,y]=pt(i,max*f); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
    ctx.closePath(); ctx.strokeStyle="#e1e3f5"; ctx.lineWidth=1; ctx.stroke();
  });
  for(var i=0;i<n;i++){ var [x,y]=pt(i,max); ctx.beginPath(); ctx.moveTo(cx,cy); ctx.lineTo(x,y); ctx.strokeStyle="#e1e3f5"; ctx.lineWidth=1; ctx.stroke(); }
  // required outline
  ctx.beginPath();
  for(var i=0;i<n;i++){ var [x,y]=pt(i,max); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); }
  ctx.closePath(); ctx.strokeStyle="rgba(239,68,68,.5)"; ctx.lineWidth=2; ctx.stroke();
  // data
  ctx.beginPath();
  values.forEach((v,i)=>{ var [x,y]=pt(i,v); i===0?ctx.moveTo(x,y):ctx.lineTo(x,y); });
  ctx.closePath(); ctx.fillStyle="rgba(79,70,229,.18)"; ctx.fill(); ctx.strokeStyle="#4f46e5"; ctx.lineWidth=2; ctx.stroke();
  values.forEach((v,i)=>{ var [x,y]=pt(i,v); ctx.beginPath(); ctx.arc(x,y,4,0,2*Math.PI); ctx.fillStyle="#4f46e5"; ctx.fill(); });
  labels.forEach((lbl,i)=>{
    var [x,y]=pt(i,max+0.9);
    ctx.fillStyle="#1b1750"; ctx.font="10px 'Segoe UI',sans-serif"; ctx.textAlign="center";
    var ws=lbl.split(" ");
    ws.slice(0,2).forEach((w,wi)=>ctx.fillText(w,x,y+wi*13));
  });
}

function drawProgressChart(id) {
  var c=document.getElementById(id); if(!c) return;
  var ctx=c.getContext("2d"), W=c.width, H=c.height;
  ctx.clearRect(0,0,W,H);
  var data=S.trainingProgress.slice(0,9);
  var bH=18, gap=8, padL=110, padR=60, chartW=W-padL-padR;
  data.forEach((t,i)=>{
    var y=i*(bH+gap)+10;
    ctx.fillStyle="#6b6a8a"; ctx.font="12px 'Segoe UI',sans-serif"; ctx.textAlign="right";
    ctx.fillText(t.name.split(" ")[0],padL-6,y+bH/2+4);
    ctx.beginPath(); ctx.rect(padL,y,chartW,bH); ctx.fillStyle="#e7e8fb"; ctx.fill();
    var bw=(t.progress/100)*chartW;
    ctx.beginPath(); ctx.rect(padL,y,bw,bH);
    ctx.fillStyle=t.progress>=70?"#2da44e":t.progress>=40?"#f59e0b":"#ef4444"; ctx.fill();
    ctx.fillStyle="#1b1750"; ctx.font="bold 11px 'Segoe UI',sans-serif"; ctx.textAlign="left";
    ctx.fillText(t.progress+"%",padL+chartW+6,y+bH/2+4);
  });
}

function drawCharts() {
  setTimeout(function(){
    // Donut on overview
    if(document.getElementById("gapDonutChart")){
      var noG=S.employees.filter(e=>e.gaps===0).length;
      var minG=S.employees.filter(e=>e.gaps>=1&&e.gaps<=2).length;
      var crG=S.employees.filter(e=>e.gaps>=3).length;
      drawDonut("gapDonutChart",[{value:noG,color:"#2da44e"},{value:minG,color:"#f59e0b"},{value:crG,color:"#ef4444"}]);
    }
    if(document.getElementById("radarChart")){
      var gs=S.skillGaps.slice(0,6);
      drawRadar("radarChart",gs.map(g=>g.skill.split(" ")[0]),gs.map(g=>g.teamAvg),5);
    }
    if(document.getElementById("gapBarChart")){
      var gs=S.skillGaps.slice(0,6);
      var cols=gs.map(g=>g.severity==="high"?"#ef4444":g.severity==="medium"?"#f59e0b":"#2da44e");
      drawBar("gapBarChart",gs.map(g=>g.skill),gs.map(g=>g.employeesGap),cols);
    }
    if(document.getElementById("progressBarsChart")) drawProgressChart("progressBarsChart");
  },60);
}

/* ====== RENDER ====== */
function render() {
  var fn = views[currentView];
  $("#main").innerHTML = fn ? fn() : views.overview();
  renderNav();
  drawCharts();
  document.title = currentView.charAt(0).toUpperCase()+currentView.slice(1)+" | Manager Dashboard | WKI";
}
function go(view) {
  if(!views[view]) view="overview";
  currentView=view;
  if(location.hash!=="#"+view) location.hash=view;
  render();
  window.scrollTo({top:0});
  $("#main").focus({preventScroll:true});
}

/* ====== EVENTS ====== */
document.addEventListener("click", function(e){
  var el=e.target.closest("[data-act]"); if(!el) return;
  var act=el.dataset.act;
  if(act==="go"){ go(el.dataset.view); return; }
  if(act==="viewemp"){ showEmployeeModal(+el.dataset.empid); return; }
  if(act==="exportcsv"){ exportCSV(); return; }
  if(act==="printreport"){ window.print(); return; }
});
document.getElementById("modalClose").addEventListener("click", closeModal);
document.getElementById("empModal").addEventListener("click", function(e){ if(e.target===this) closeModal(); });
document.addEventListener("change", function(e){
  if(e.target.id==="gapFilter"){ var tb=document.getElementById("gapTableBody"); if(tb) tb.innerHTML=renderGapRows(e.target.value); return; }
  if(e.target.id==="recFilter"||e.target.id==="typeFilter"||e.target.id==="deptFilter") render();
});
document.addEventListener("input", function(e){
  if(e.target.id==="teamSearch"){ clearTimeout(document._st); document._st=setTimeout(render,200); }
});
window.addEventListener("hashchange", function(){
  var v=location.hash.slice(1);
  if(v&&views[v]&&v!==currentView) go(v);
});

/* ====== CSV EXPORT ====== */
function exportCSV(){
  var rows=[],cell=v=>'"'+String(v??"").replace(/"/g,'""')+'"';
  var add=function(){ rows.push([...arguments].map(cell).join(",")); };
  add("WKI Manager Report","Generated: "+new Date().toLocaleString());
  add();add("TEAM SUMMARY");add("Total Employees",S.summary.totalEmployees);add("Critical Gaps",S.summary.criticalGaps);add("Avg Training %",S.summary.trainingCompletion);add("On Track",S.summary.onTrack);
  add();add("EMPLOYEES");add("Name","Role","Department","Gaps","Training %","Status");
  S.employees.forEach(e=>add(e.name,e.role,e.department,e.gaps,e.training,e.status));
  add();add("SKILL GAPS");add("Skill","Category","Team Avg","Required","Gap","Affected","Severity");
  S.skillGaps.forEach(g=>add(g.skill,g.category,g.teamAvg,g.required,(g.required-g.teamAvg).toFixed(1),g.employeesGap,g.severity));
  add();add("RECOMMENDATIONS");add("Title","Provider","Skill","Priority","Employees","Duration (h)","Type");
  S.recommendations.forEach(r=>add(r.title,r.provider,r.skill,r.priority,r.employees,r.duration,r.type));
  var blob=new Blob(["\uFEFF"+rows.join("\r\n")],{type:"text/csv;charset=utf-8"});
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="team-manager-report.csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  toast("CSV downloaded!");
}

/* ====== INIT ====== */
(async function init(){
  var sess=getSession(); if(!sess) return goLogin();
  try {
    S = getMockData();
    computeSummary();
    var v=location.hash.slice(1);
    currentView=views[v]?v:"overview";
    render();
  } catch(err){
    $("#main").innerHTML='<div class="card empty"><b>Could not load dashboard</b><p style="margin:8px 0">'+esc(err.message)+'</p><button class="btn" onclick="location.reload()">Try again</button></div>';
  }
})();
