spring.application.name=wki-auth
server.port=8080

# ---- MySQL (change username/password) ----
spring.datasource.url=jdbc:mysql://localhost:3306/workforce_knowledge_intelligence?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=aish

# Never let Hibernate alter your existing schema
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# ---- JWT ----
# Must be at least 32 characters. Change it for any real deployment.
app.jwt.secret=change-this-to-a-long-random-secret-key-at-least-32-chars
app.jwt.expiration-minutes=120

# ---- CORS: origins allowed to call the API (Live Server default ports) ----
app.cors.allowed-origins=http://127.0.0.1:5500,http://localhost:5500,http://localhost:8080

# ---- Registration policy ----
# true  = anyone can pick any role on the register form (fine for a demo)
# false = ADMIN and HR_MANAGER cannot be self-selected
app.allow-privileged-self-signup=true

server.error.include-message=always

# We use JWT, not Spring's auto-generated default user (silences the "generated security password" log line)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
