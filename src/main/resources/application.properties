spring.application.name=SpringProjectTeam2
server.port=8080

# Database Connection (Make sure 'knowledge_gap_db' is created in pgAdmin/PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/knowledge_gap_db
spring.datasource.username=postgres
spring.datasource.password=1891

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect