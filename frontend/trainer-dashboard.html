<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mentor Dashboard | Workforce Intelligence</title>
<!-- custom-page: hand-built, so _generate_dashboards.py will not overwrite it -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=premium">
<style>
:root {
  --brand: #0B6E75; --brand-dark: #095A60; --tint: #E3F1F2;
  --nav: #101C2B; --ink: #1A2433; --muted: #5B6778;
  --bg: #F3F5F8; --card: #fff; --line: #DDE2E9;
  --ok: #1F7A4D; --ok-bg: #E5F3EB;
  --warn: #8A5A00; --warn-bg: #FFF1D6;
  --bad: #B3261E; --bad-bg: #FBE7E5;
  --amber: #D9822B; --blue: #2F6FA3; --grey: #9AA5B4;
  --shadow-xs: 0 1px 2px rgba(16,28,43,.04);
  --shadow-sm: 0 2px 6px rgba(16,28,43,.06);
  --shadow-md: 0 6px 16px rgba(16,28,43,.08);
  --shadow-lg: 0 12px 28px rgba(16,28,43,.10);
  --shadow-xl: 0 20px 40px rgba(16,28,43,.14);
  --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body {
  margin: 0;
  font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.45;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #5FB3B8; outline-offset: 2px; }

/* ===== HEADER ===== */
.brand {
  display: flex; align-items: center; gap: 12px; font-size: 16px; line-height: 1.2; font-weight: 500;
}
.logo-box {
  background: linear-gradient(135deg, var(--brand), #0d848d);
  border-radius: 8px; padding: 8px 12px; font-weight: 700; letter-spacing: .5px;
  box-shadow: 0 2px 8px rgba(11,110,117,.35);
}
.right { display: flex; align-items: center; gap: 16px; }
.who { text-align: right; line-height: 1.2; font-size: 13.5px; }
.who div { font-weight: 600; }
.who small { display: block; opacity: .78; font-size: 11.5px; }
.pill {
  background: rgba(255,255,255,.14); border-radius: 20px;
  padding: 4px 12px; font-size: 11px; font-weight: 700; letter-spacing: .4px;
  text-transform: uppercase; border: 1px solid rgba(255,255,255,.12);
}

/* ===== BUTTONS ===== */
.btn {
  background: var(--brand); color: #fff; border: 0; border-radius: 8px;
  padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 13.5px;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all var(--transition-fast);
  box-shadow: 0 1px 3px rgba(11,110,117,.2);
  text-decoration: none;
}
.btn:hover {
  background: var(--brand-dark);
  box-shadow: 0 4px 12px rgba(11,110,117,.28);
  transform: translateY(-1px);
}
.btn:active { transform: translateY(0); box-shadow: 0 1px 2px rgba(11,110,117,.2); }
.btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
.btn.ghost {
  background: #fff; color: var(--brand); border: 1px solid var(--line);
  box-shadow: var(--shadow-xs);
}
.btn.ghost:hover {
  background: var(--tint); border-color: var(--brand);
  color: var(--brand-dark); box-shadow: var(--shadow-sm);
}
.btn.danger {
  background: #fff; color: var(--bad); border: 1px solid #E5B3AF;
  box-shadow: var(--shadow-xs);
}
.btn.danger:hover {
  background: var(--bad-bg); border-color: var(--bad);
  box-shadow: var(--shadow-sm);
}
.btn.small { padding: 5px 12px; font-size: 12.5px; border-radius: 6px; }
.btn.nav {
  background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.25);
  color: #fff; padding: 7px 14px; font-size: 12.5px; border-radius: 6px;
}
.btn.nav:hover {
  background: rgba(255,255,255,.15); border-color: rgba(255,255,255,.45);
  transform: translateY(-1px);
}

.bell {
  position: relative; background: transparent; border: 0; color: #fff;
  cursor: pointer; padding: 7px; border-radius: 8px; transition: background var(--transition-fast);
}
.bell:hover { background: rgba(255,255,255,.12); }
.cnt {
  background: #C8372D; color: #fff; border-radius: 999px; font-size: 11px;
  padding: 1px 7px; font-weight: 600;
}
.bell .cnt { position: absolute; top: -2px; right: -4px; box-shadow: 0 0 0 2px var(--nav); }

h1 { font-size: 26px; margin: 0 0 4px; font-weight: 600; letter-spacing: -.01em; }
h2 { font-size: 18px; margin: 0 0 12px; font-weight: 600; }
.lead { color: var(--muted); font-size: 14px; margin: 0 0 20px; max-width: 72ch; }

/* ===== STAT TILES ===== */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 16px; margin-bottom: 20px;
}
.stat {
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  padding: 18px 20px; box-shadow: var(--shadow-sm); box-shadow: inset 0 3px 0 var(--brand), var(--shadow-sm);
  transition: all var(--transition-fast); position: relative; overflow: hidden;
}
.stat:hover {
  transform: translateY(-2px); box-shadow: inset 0 3px 0 var(--brand), var(--shadow-md);
  border-color: #CAD5E2;
}
.stat b {
  display: block; font-size: 28px; font-weight: 700; line-height: 1.15;
  color: var(--ink); margin-bottom: 4px; font-variant-numeric: tabular-nums;
}
.stat span { font-size: 13px; color: var(--muted); font-weight: 500; }

/* ===== CARDS & GRIDS ===== */
.grid2 {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  gap: 20px; margin-bottom: 20px;
}
.card {
  background: #fff; border: 1px solid var(--line); border-radius: 12px;
  padding: 22px; margin-bottom: 20px; box-shadow: var(--shadow-sm);
  transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
}
.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #CAD5E2; }
.grid2 .card { margin-bottom: 0; }
.card .sub { color: var(--muted); font-size: 13px; margin: 0 0 14px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg text { font-family: inherit; fill: var(--muted); font-size: 11px; }

/* ===== ROWS & TAGS ===== */
.row {
  display: flex; justify-content: space-between; align-items: flex-start;
  gap: 12px; padding: 14px 0; border-top: 1px solid var(--line);
}
.row:first-of-type { border-top: 0; }
.row h3 { font-size: 14.5px; margin: 0; font-weight: 600; }
.row p { margin: 3px 0 0; font-size: 13px; color: var(--muted); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.tag {
  display: inline-block; font-size: 11.5px; font-weight: 600; border-radius: 6px;
  padding: 3px 9px; margin: 2px 4px 0 0; background: var(--tint); color: var(--brand-dark);
}
.tag.warn { background: var(--warn-bg); color: var(--warn); }
.tag.bad  { background: var(--bad-bg);  color: var(--bad);  }
.tag.ok   { background: var(--ok-bg);   color: var(--ok);   }

/* ===== FORMS ===== */
label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 5px; }
input, select, textarea {
  width: 100%; padding: 9px 12px; border: 1px solid #C3CBD6;
  border-radius: 8px; background: #fff; font-size: 13.5px;
  transition: all var(--transition-fast);
}
input:focus, select:focus, textarea:focus {
  border-color: var(--brand); outline: none;
  box-shadow: 0 0 0 3px rgba(11,110,117,.16);
}
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.bar {
  height: 8px; background: #E6EAF0; border-radius: 999px;
  overflow: hidden; margin-top: 6px;
}
.bar i {
  display: block; height: 100%; background: var(--brand);
  border-radius: 999px; transition: width .4s cubic-bezier(0.4,0,0.2,1);
}
/* .empty styles inherited from style.css */
.err {
  background: var(--bad-bg); color: var(--bad); border-radius: 8px;
  padding: 12px 16px; font-size: 14px; margin-bottom: 16px;
  border: 1px solid #E5B3AF;
}
.chk {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  border-top: 1px solid var(--line); font-weight: 500; margin: 0;
  transition: background var(--transition-fast); cursor: pointer;
}
.chk:hover { background: #F8FAFD; }
.chk input { width: auto; }
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
  background: var(--nav); color: #fff; padding: 11px 20px; border-radius: 8px;
  font-size: 13.5px; font-weight: 500; z-index: 200; box-shadow: var(--shadow-lg);
}
.toast.bad { background: var(--bad); }
.unread { background: var(--tint); border-radius: 8px; padding: 12px 10px; margin: 2px 0; }

/* ===== RESPONSIVE ===== */
@media (max-width: 992px) {
  .f2 { grid-template-columns: 1fr; }
  .who { display: none; }
  .stats { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 520px) {
  .top { padding: 12px 14px; }
  .stats { grid-template-columns: 1fr 1fr; }
}
</style>
</head>

<script>
const API = "http://localhost:8080/api/mentor";
const $ = (s, r) => (r || document).querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function session() { try { return JSON.parse(localStorage.getItem("wki_session") || "null"); } catch (_) { return null; } }
function goLogin() { localStorage.removeItem("wki_session"); location.replace("login.html"); }
async function call(path, method, body) {
  const s = session(); if (!s || !s.token) { goLogin(); throw new Error("Please log in"); }
  let res;
  try { res = await fetch(API + path, { method: method || "GET", headers: Object.assign({ Authorization: "Bearer " + s.token }, body ? { "Content-Type": "application/json" } : {}), body: body ? JSON.stringify(body) : undefined }); }
  catch (_) { throw new Error("Cannot reach the server. Is the backend running on port 8080?"); }
  if (res.status === 401) { goLogin(); throw new Error("Session expired, please log in again"); }
  const data = await res.json().catch(() => null);
  if (!res.ok) throw new Error((data && (data.message || data.error)) || "Request failed (" + res.status + ")");
  return data;
}
let toastT;
function toast(msg, bad) { const t = $("#toast"); t.textContent = msg; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3500); }
function fmt(d) { return d ? new Date(d).toLocaleString("en-IN", { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" }) : ""; }
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;

/* ---------- charts (plain SVG, no library) ---------- */
function barsChart(months) {
  const W = 520, H = 220, L = 30, B = 28, T = 10, max = Math.max(4, ...months.map(m => Math.max(m.sessions, m.registered)));
  const step = Math.ceil(max / 4), top = step * 4, bw = (W - L) / months.length, ph = H - B - T;
  let g = "";
  for (let i = 0; i <= 4; i++) { const y = T + ph - ph * i / 4; g += `<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#E6EAF0"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${step * i}</text>`; }
  months.forEach((m, i) => {
    const x = L + i * bw + bw / 2, h1 = ph * m.sessions / top, h2 = ph * m.registered / top;
    g += `<rect x="${x - 16}" y="${T + ph - h1}" width="14" height="${h1}" rx="2" fill="#0B6E75"><title>${esc(m.label)}: ${m.sessions} sessions</title></rect>`
      + `<rect x="${x + 2}" y="${T + ph - h2}" width="14" height="${h2}" rx="2" fill="#D9822B"><title>${esc(m.label)}: ${m.registered} registrations</title></rect>`
      + `<text x="${x}" y="${H - 8}" text-anchor="middle">${esc(m.label)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Sessions held and employees registered per month">${g}</svg>`
    + `<div class="legend"><span><i style="background:#0B6E75"></i>Sessions</span><span><i style="background:#D9822B"></i>Employees registered</span></div>`;
}
const STATUS = { ACTIVE: ["Active", "#0B6E75"], REQUESTED: ["Pending", "#D9822B"], COMPLETED: ["Completed", "#1F7A4D"], DECLINED: ["Declined", "#9AA5B4"] };
function donut(status) {
  const keys = Object.keys(STATUS), total = keys.reduce((a, k) => a + (status[k] || 0), 0);
  if (!total) return `<div class="empty">No mentorship requests yet.</div>`;
  const R = 62, C = 2 * Math.PI * R; let off = 0, segs = "";
  keys.forEach(k => { const v = status[k] || 0; if (!v) return; const len = C * v / total;
    segs += `<circle r="${R}" cx="90" cy="90" fill="none" stroke="${STATUS[k][1]}" stroke-width="24" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" transform="rotate(-90 90 90)"><title>${STATUS[k][0]}: ${v}</title></circle>`; off += len; });
  return `<div style="display:flex;align-items:center;gap:22px;flex-wrap:wrap"><svg viewBox="0 0 180 180" width="170" role="img" aria-label="Mentorship requests by status">${segs}<text x="90" y="88" text-anchor="middle" style="font-size:26px;font-weight:600;fill:#1A2433">${total}</text><text x="90" y="106" text-anchor="middle">requests</text></svg>`
    + `<div class="legend" style="flex-direction:column;gap:8px;margin:0">${keys.map(k => `<span><i style="background:${STATUS[k][1]}"></i>${STATUS[k][0]}: <b style="color:#1A2433">${status[k] || 0}</b></span>`).join("")}</div></div>`;
}
function gapBars(gaps) {
  if (!gaps.length) return `<div class="empty">No skill gaps found yet. They appear as employees complete assessments.</div>`;
  const max = Math.max(...gaps.map(g => g.withGap));
  return gaps.map(g => `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(g.skillName)}</span><b>${g.withGap} of ${g.assessed} employees</b></div><div class="bar"><i style="width:${pct(g.withGap, max)}%;background:#B3261E"></i></div></div>`).join("");
}
function attendanceChart(list) {
  const rows = list.filter(s => s.registered > 0);
  if (!rows.length) return `<div class="empty">Attendance appears after your first session with registrations.</div>`;
  return rows.map(s => { const m = s.marked > 0, p = m ? pct(s.attended, s.registered) : 0;
    return `<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;gap:10px"><span>${esc(s.title)}</span><b>${m ? s.attended + " / " + s.registered : "not marked"}</b></div><div class="bar"><i style="width:${p}%;background:${p >= 70 ? "#1F7A4D" : "#D9822B"}"></i></div></div>`; }).join("");
}
function levelDots(level, target) {
  let s = ""; for (let i = 1; i <= 5; i++) s += `<span style="display:inline-block;width:14px;height:6px;margin-right:2px;border-radius:2px;background:${i <= level ? "#0B6E75" : "#E6EAF0"};${i === target ? "box-shadow:0 0 0 1.5px #D9822B" : ""}"></span>`;
  return s;
}

/* ---------- state ---------- */
const S = { ov: null, req: null, mentees: null, sess: null, gaps: null, notif: { unread: 0, items: [] }, openAtt: null, att: [], plan: null };
const $v = () => $("#view");
const errBox = e => `<div class="err">${esc(e.message)}</div>`;

const views = {
  async overview() {
    const d = S.ov = await call("/overview"), s = d.stats, n = d.nextSession;
    const pr = S.prof || await call("/profile").catch(() => null);
    const banner = pr && !pr.skillIds.length ? `<div class="card" style="border-color:var(--amber)"><h2>List the skills you teach</h2><p class="sub">Employees can only find and request you once your profile lists at least one skill.</p><a class="btn" style="display:inline-block;text-decoration:none" href="#profile">Set up my profile</a></div>` : "";
    const sessUser = session();
    const mentorName = (sessUser && sessUser.fullName) || (pr && pr.name) || "Mentor";
    return `<h1>Welcome back to the Mentor Dashboard, ${esc(mentorName)}!</h1><p class="lead">How your sessions are helping employees close their skill gaps.</p>${banner}
    <div class="stats">
      <div class="stat p1"><b>${s.activeMentees}</b><span>Active mentees</span><span class="tile-icon">👥</span></div>
      <div class="stat p4"><b>${s.pendingRequests}</b><span>Pending requests</span><span class="tile-icon">⏳</span></div>
      <div class="stat p2"><b>${s.upcomingSessions}</b><span>Upcoming sessions</span><span class="tile-icon">📅</span></div>
      <div class="stat p5"><b>${s.sessionsHeld}</b><span>Sessions held</span><span class="tile-icon">✅</span></div>
      <div class="stat p6"><b>${s.employeesReached}</b><span>Employees reached</span><span class="tile-icon">🎓</span></div>
      <div class="stat p3"><b>${s.attendanceRate == null ? "&ndash;" : s.attendanceRate + "%"}</b><span>Attendance rate</span><span class="tile-icon">📈</span></div>
    </div>
    ${n ? `<div class="card"><h2>Next session</h2><div class="row"><div><h3>${esc(n.title)}</h3><p>${fmt(n.scheduledAt)} &middot; ${n.durationMin} min &middot; ${n.mode === "IN_PERSON" ? "In person" : "Online"} &middot; ${n.registered} registered</p></div></div></div>` : ""}
    <div class="grid2">
      <div class="card"><h2>Sessions and registrations</h2><p class="sub">Last 6 months</p>${barsChart(d.months)}</div>
      <div class="card"><h2>Mentorship requests</h2><p class="sub">By status</p>${donut(d.mentorshipStatus)}</div>
      <div class="card"><h2>Where employees need help</h2><p class="sub">Employees below target level, by skill</p>${gapBars(d.topGaps)}${d.topGaps.length ? `<p style="margin:10px 0 0"><a href="#insights" style="color:var(--brand);font-weight:600;font-size:13px">Plan sessions for these skills</a></p>` : ""}</div>
      <div class="card"><h2>Attendance per session</h2><p class="sub">Most recent past sessions</p>${attendanceChart(d.recentSessions)}</div>
    </div>`;
  },
  async requests() {
    const r = S.req = await call("/requests"); setReq(r.length);
    return `<h1>Mentorship requests</h1><p class="lead">Employees asking you to mentor them. Their biggest skill gaps are shown so you can decide where you can help.</p>
    <div class="card">${r.length ? r.map(x => `<div class="row"><div><h3>${esc(x.menteeName)}</h3><p>${esc(x.topic || "No topic given")} &middot; ${fmt(x.createdAt)}</p>
      <div>${x.gaps.length ? x.gaps.map(g => `<span class="tag warn">${esc(g.skillName)}: level ${g.level} of ${g.targetLevel}</span>`).join("") : `<span class="tag">No assessed gaps</span>`}</div></div>
      <div class="acts"><button class="btn small" data-act="answer" data-id="${x.mentorshipId}" data-status="ACTIVE">Accept</button><button class="btn small danger" data-act="answer" data-id="${x.mentorshipId}" data-status="DECLINED">Decline</button></div></div>`).join("") : `<div class="empty">No pending requests.</div>`}</div>`;
  },
  async mentees() {
    const m = S.mentees = await call("/mentees");
    return `<h1>My mentees</h1><p class="lead">Progress of the employees you mentor.</p>` + (m.length ? m.map(x => `<div class="card"><div class="row" style="border:0;padding:0"><div><h3 style="font-size:16px;margin:0">${esc(x.menteeName)}</h3><p>${esc(x.topic || "")}</p></div>
      <div class="acts"><span class="tag ${x.status === "ACTIVE" ? "" : "ok"}">${x.status === "ACTIVE" ? "Active" : "Completed"}</span>${x.status === "ACTIVE" ? `<button class="btn small ghost" data-act="answer" data-id="${x.mentorshipId}" data-status="COMPLETED">Mark complete</button>` : ""}</div></div>
      <div class="stats" style="margin:14px 0">
        <div class="stat p2"><b>${x.sessionsAttended}</b><span>Your sessions attended</span><span class="tile-icon">📅</span></div>
        <div class="stat p1"><b>${x.learning.avgProgress}%</b><span>Avg course progress</span><span class="tile-icon">📊</span></div>
        <div class="stat p5"><b>${x.learning.completed}/${x.learning.enrolled}</b><span>Courses completed</span><span class="tile-icon">🎓</span></div></div>
      ${x.skills.length ? x.skills.map(k => `<div style="display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px"><span>${esc(k.skillName)}</span><span>${levelDots(k.level, k.targetLevel)} <b style="margin-left:6px">${k.level}/${k.targetLevel}</b></span></div>`).join("") + `<div class="legend"><span><i style="background:#0B6E75"></i>Current level</span><span><i style="background:#fff;box-shadow:0 0 0 1.5px #D9822B"></i>Target</span></div>` : `<div class="empty">No assessments taken yet.</div>`}</div>`).join("") : `<div class="card"><div class="empty">No mentees yet. Accept a request to start.</div></div>`);
  },
  async sessions() {
    const [list, g] = await Promise.all([call("/sessions"), S.gaps || call("/skill-gaps")]); S.sess = list; S.gaps = g;
    const up = list.filter(x => x.upcoming).reverse(), past = list.filter(x => !x.upcoming);
    const p = S.plan || {};
    const card = x => `<div class="row"><div><h3>${esc(x.title)}</h3><p>${fmt(x.scheduledAt)} &middot; ${x.durationMin} min &middot; ${x.mode === "IN_PERSON" ? "In person" + (x.location ? ", " + esc(x.location) : "") : "Online" + (x.location ? ", " + esc(x.location) : "")}</p>
      <div>${x.skillName ? `<span class="tag">${esc(x.skillName)}</span>` : ""}<span class="tag">${x.registered} registered</span>${x.marked ? `<span class="tag ok">${x.attended} attended</span>` : ""}</div></div>
      <div class="acts">${x.upcoming ? `<button class="btn small danger" data-act="cancel" data-id="${x.sessionId}">Cancel</button>` : `<button class="btn small ghost" data-act="attendance" data-id="${x.sessionId}">${x.marked ? "Edit" : "Mark"} attendance</button>`}</div></div>
      ${S.openAtt === x.sessionId ? attPanel() : ""}`;
    return `<h1>Sessions</h1><p class="lead">Schedule a session on a skill. Employees with a gap in that skill, and your active mentees, are notified automatically.</p>
    <div class="card"><h2>Schedule a session</h2>
      <form id="sessForm"><label for="f-title">Title</label><input id="f-title" name="title" maxlength="150" required value="${esc(p.title || "")}">
      <div class="f2"><div><label for="f-skill">Skill covered</label><select id="f-skill" name="skillId"><option value="">General (no specific skill)</option>${g.catalog.map(s => `<option value="${s.skillId}"${String(p.skillId) === String(s.skillId) ? " selected" : ""}>${esc(s.skillName)}</option>`).join("")}</select></div>
      <div><label for="f-when">Date and time</label><input id="f-when" name="scheduledAt" type="datetime-local" required></div>
      <div><label for="f-dur">Duration (minutes)</label><input id="f-dur" name="durationMin" type="number" min="15" max="480" step="15" value="60"></div>
      <div><label for="f-mode">Type</label><select id="f-mode" name="mode"><option value="ONLINE">Online</option><option value="IN_PERSON">In person</option></select></div></div>
      <label for="f-loc">Meeting link or room</label><input id="f-loc" name="location" maxlength="200">
      <label for="f-desc">What will be covered</label><textarea id="f-desc" name="description" rows="3" maxlength="500"></textarea>
      <button class="btn" style="margin-top:14px" type="submit">Schedule session</button></form></div>
    <div class="card"><h2>Upcoming</h2>${up.length ? up.map(card).join("") : `<div class="empty">Nothing scheduled.</div>`}</div>
    <div class="card"><h2>Past sessions</h2>${past.length ? past.map(card).join("") : `<div class="empty">No past sessions yet.</div>`}</div>`;
  },
  async insights() {
    const g = S.gaps = await call("/skill-gaps");
    return `<h1>Skill-gap insights</h1><p class="lead">Skills where employees are below their target level, from completed assessments. Plan a session where many people share the same gap.</p>
    <div class="card"><h2>Gaps by skill</h2><p class="sub">Employees below target</p>${gapBars(g.gaps)}</div>
    <div class="card"><h2>Suggested sessions</h2>${g.gaps.length ? g.gaps.slice(0, 8).map(x => `<div class="row"><div><h3>${esc(x.skillName)}</h3><p>${x.withGap} of ${x.assessed} assessed employees are below target. Average level ${x.avgLevel}, target ${x.targetLevel}.</p></div>
      <button class="btn small" data-act="plan" data-skill="${x.skillId}" data-name="${esc(x.skillName)}">Plan a session</button></div>`).join("") : `<div class="empty">No gaps yet.</div>`}</div>`;
  },
  async profile() {
    const p = S.prof = await call("/profile"), sel = new Set(p.skillIds), cats = {};
    p.catalog.forEach(s => (cats[s.category || "Other"] = cats[s.category || "Other"] || []).push(s));
    return `<h1>My mentor profile</h1><p class="lead">Choose the skills you can teach. Employees see this list under Sharing and Mentorship and can request you as their mentor.</p>
    <form class="card" id="profForm">
      <label for="p-head">Headline (optional)</label><input id="p-head" maxlength="200" placeholder="e.g. Senior engineer, 8 years of Java and cloud" value="${esc(p.headline || "")}">
      <label style="display:flex;gap:10px;align-items:center;font-weight:500"><input type="checkbox" id="p-acc" style="width:auto"${p.accepting ? " checked" : ""}> I am accepting new mentees</label>
      <h2 style="margin-top:18px">Skills I can teach <span class="tag" id="p-count">${sel.size} selected</span></h2>
      ${Object.keys(cats).map(c => `<div style="margin-top:12px"><div style="font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px">${esc(c)}</div><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px">${cats[c].map(s => `<label class="chk" style="border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:0;font-size:13px"><input type="checkbox" data-skill="${s.skillId}"${sel.has(s.skillId) ? " checked" : ""}> ${esc(s.skillName)}</label>`).join("")}</div></div>`).join("")}
      <button class="btn" style="margin-top:18px" type="submit">Save profile</button></form>`;
  },
  async notifications() {
    await loadNotif(); const n = S.notif;
    return `<h1>Notifications</h1><p class="lead">Updates about your sessions and mentorships.</p><div class="card">
      ${n.items.length ? `<div style="text-align:right;margin-bottom:6px"><button class="btn small ghost" data-act="readall">Mark all read</button></div>` + n.items.map(i => `<div class="row ${i.isRead ? "" : "unread"}" style="padding:12px 8px"><div><p style="color:var(--ink);margin:0">${esc(i.message)}</p><p>${fmt(i.createdAt)}</p></div>${i.isRead ? "" : `<button class="btn small ghost" data-act="read" data-id="${i.notificationId}">Mark read</button>`}</div>`).join("") : `<div class="empty">No notifications.</div>`}</div>`;
  }
};
function attPanel() {
  if (!S.att.length) return `<div class="empty">Nobody registered for this session.</div>`;
  return `<div style="background:var(--bg);border-radius:8px;padding:10px 14px;margin:0 0 10px"><b style="font-size:13px">Tick everyone who attended</b>${S.att.map(a => `<label class="chk"><input type="checkbox" data-emp="${a.employeeId}"${a.attended === 1 || a.attended === true ? " checked" : ""}> ${esc(a.name)}</label>`).join("")}<button class="btn small" style="margin-top:10px" data-act="saveatt">Save attendance</button></div>`;
}

/* ---------- plumbing ---------- */
function setReq(n) { const e = $("#reqCount"); e.hidden = !n; e.textContent = n; }
function setUnread(n) { ["#badge", "#navCount"].forEach(id => { const e = $(id); e.hidden = !n; e.textContent = n > 99 ? "99+" : n; }); }
async function loadNotif() { S.notif = await call("/notifications"); setUnread(S.notif.unread); }
let current = "";
async function render() {
  const v = (location.hash || "#overview").slice(1); const name = views[v] ? v : "overview"; current = name;
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.v === name));
  try { const html = await views[name](); if (current === name) $v().innerHTML = html; setDefaultWhen(); }
  catch (e) { $v().innerHTML = errBox(e); }
}
function setDefaultWhen() { const w = $("#f-when"); if (w && !w.value) { const d = new Date(Date.now() + 86400000); d.setHours(10, 0, 0, 0); w.value = new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16); } }
async function refreshBadges() { try { await loadNotif(); const r = await call("/requests"); setReq(r.length); } catch (_) {} }

document.addEventListener("click", async e => {
  const go = e.target.closest("[data-go]"); if (go) { location.hash = go.dataset.go; return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const act = el.dataset.act, id = +el.dataset.id;
  try {
    if (act === "answer") { await call("/requests/" + id, "PUT", { status: el.dataset.status }); toast("Updated"); await render(); refreshBadges(); }
    else if (act === "cancel") { if (!confirm("Cancel this session? Registered employees will be notified.")) return; await call("/sessions/" + id, "DELETE"); toast("Session cancelled"); await render(); }
    else if (act === "attendance") { if (S.openAtt === id) S.openAtt = null; else { S.att = await call("/sessions/" + id + "/attendees"); S.openAtt = id; } await render(); }
    else if (act === "saveatt") { const ids = [...document.querySelectorAll("[data-emp]:checked")].map(c => +c.dataset.emp); await call("/sessions/" + S.openAtt + "/attendance", "PUT", { attendedIds: ids }); S.openAtt = null; toast("Attendance saved"); await render(); }
    else if (act === "plan") { S.plan = { skillId: el.dataset.skill, title: "Workshop: " + el.dataset.name }; location.hash = "sessions"; }
    else if (act === "read") { await call("/notifications/" + id + "/read", "PUT"); await render(); }
    else if (act === "readall") { await call("/notifications/read-all", "PUT"); await render(); }
  } catch (err) { toast(err.message, true); }
});
document.addEventListener("change", e => { if (e.target.dataset.skill) { const c = $("#p-count"); if (c) c.textContent = document.querySelectorAll("[data-skill]:checked").length + " selected"; } });
document.addEventListener("submit", async e => {
  if (e.target.id === "profForm") {
    e.preventDefault();
    try { const r = await call("/profile", "PUT", { headline: $("#p-head").value, accepting: $("#p-acc").checked, skillIds: [...document.querySelectorAll("[data-skill]:checked")].map(c => +c.dataset.skill) });
      toast("Profile saved, " + r.skills + " skill" + (r.skills === 1 ? "" : "s") + " listed"); S.noSkills = r.skills === 0; render(); }
    catch (err) { toast(err.message, true); }
    return;
  }
  if (e.target.id !== "sessForm") return; e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target)); f.durationMin = +f.durationMin; if (!f.skillId) delete f.skillId;
  const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
  try { const r = await call("/sessions", "POST", f); S.plan = null; toast("Session scheduled, " + r.invited + " employee" + (r.invited === 1 ? "" : "s") + " notified"); await render(); refreshBadges(); }
  catch (err) { toast(err.message, true); btn.disabled = false; }
});
window.addEventListener("hashchange", render);
(function boot() { const t = setInterval(() => { if (!$("#app").hidden) { clearInterval(t); render(); refreshBadges(); } }, 50); setTimeout(() => clearInterval(t), 8000); })();
</script>
</body>
</html>
