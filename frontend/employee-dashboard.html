<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Employee Dashboard | Workforce Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=premium">
<style>
  :root {
    --brand: #0B6E75; --brand-dark: #095A60; --brand-light: #E3F1F2; --brand-tint: #E3F1F2;
    --brand-glow: rgba(11, 110, 117, 0.16);
    --nav: #101C2B; --ink: #1A2433; --muted: #5B6778; --bg: #F3F5F8; --card: #ffffff; --line: #DDE2E9;
    --ok: #1F7A4D; --ok-bg: #E5F3EB; --warn: #8A5A00; --warn-bg: #FFF1D6;
    --bad: #B3261E; --bad-bg: #FBE7E5; --info-bg: #E3F1F2;
    --target: #D9822B;
    --accent1: #0B6E75; --accent2: #2F6FA3; --accent3: #D9822B;
    --accent4: #1F7A4D; --accent5: #B3261E; --accent6: #5B6778;
    --shadow-xs: 0 1px 2px rgba(16, 28, 43, 0.04);
    --shadow-sm: 0 2px 4px rgba(16, 28, 43, 0.05), 0 1px 2px rgba(16, 28, 43, 0.03);
    --shadow-md: 0 4px 14px -2px rgba(16, 28, 43, 0.08), 0 2px 6px -1px rgba(16, 28, 43, 0.04);
    --shadow-lg: 0 12px 30px -4px rgba(16, 28, 43, 0.10);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, -apple-system, Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #5FB3B8; outline-offset: 2px; }

  /* Custom scrollbars */
  ::-webkit-scrollbar { width: 7px; height: 7px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 999px; }
  ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }

  /* ===== HEADER ===== */
  .brand { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 500; line-height: 1.2; }
  .logo, .logo-box {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    border-radius: 7px;
    padding: 9px 11px;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: .5px;
    box-shadow: 0 2px 8px rgba(11, 110, 117, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.15);
  }
  .top .right { display: flex; align-items: center; gap: 16px; }
  .who { text-align: right; line-height: 1.25; }
  .who strong { display: block; font-size: 14px; font-weight: 600; }
  .who small { display: block; opacity: .75; font-size: 12px; }
  .role-badge {
    background: rgba(255, 255, 255, 0.14);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: .2px;
    border: 1px solid rgba(255, 255, 255, 0.1);
  }
  .bell {
    position: relative;
    background: transparent;
    border: 0;
    color: #fff;
    cursor: pointer;
    padding: 7px;
    border-radius: 8px;
    transition: background .15s ease;
  }
  .bell:hover { background: rgba(255, 255, 255, 0.12); }
  .bell .badge, .badge {
    position: absolute;
    top: -2px;
    right: -4px;
    background: #C8372D;
    color: #fff;
    border-radius: 999px;
    font-size: 11px;
    padding: 1px 6px;
    font-weight: 700;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }

  /* ===== BUTTONS ===== */
  .btn {
    background: linear-gradient(180deg, #0C7A82 0%, var(--brand) 100%);
    color: #fff;
    border: 0;
    border-radius: 8px;
    padding: 9px 16px;
    cursor: pointer;
    font-weight: 600;
    font-size: 13.5px;
    box-shadow: 0 2px 4px rgba(11, 110, 117, 0.2), 0 1px 2px rgba(11, 110, 117, 0.1);
    transition: all .15s ease-in-out;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }
  .btn:hover:not(:disabled) {
    background: linear-gradient(180deg, var(--brand) 0%, var(--brand-dark) 100%);
    box-shadow: 0 4px 12px rgba(11, 110, 117, 0.32);
    transform: translateY(-1px);
  }
  .btn:active:not(:disabled) {
    transform: translateY(0);
    box-shadow: 0 1px 3px rgba(11, 110, 117, 0.2);
  }
  .btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
  .btn.ghost {
    background: #fff;
    color: var(--brand);
    border: 1px solid #9DB9BC;
    box-shadow: var(--shadow-xs);
  }
  .btn.ghost:hover {
    background: var(--info-bg);
    border-color: var(--brand);
    transform: translateY(-1px);
  }
  .btn.danger {
    background: #fff;
    color: var(--bad);
    border: 1px solid #E5B3AF;
  }
  .btn.danger:hover {
    background: var(--bad-bg);
    border-color: var(--bad);
    transform: translateY(-1px);
  }
  .btn.small { padding: 6px 12px; font-size: 12.5px; border-radius: 6px; }
  .btn#logoutBtn, .btn.outline-nav {
    background: transparent;
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.35);
    box-shadow: none;
    font-size: 13px;
    padding: 7px 14px;
    border-radius: 6px;
  }
  .btn#logoutBtn:hover, .btn.outline-nav:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.5);
    transform: translateY(-1px);
    box-shadow: none;
  }

  main { min-width: 0; }
  h1 { margin: 0 0 4px; font-size: 26px; font-weight: 600; letter-spacing: -.015em; color: var(--ink); }
  h2 { margin: 0 0 12px; font-size: 18px; font-weight: 600; color: var(--ink); }
  p.lead { margin: 0 0 20px; color: var(--muted); font-size: 14px; max-width: 72ch; line-height: 1.5; }
  .section-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .section-head h1 { margin: 0 0 4px; }
  .section-head p { margin: 0; font-size: 14px; color: var(--muted); max-width: 70ch; }

  /* ===== CARDS & TILES ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 22px 24px;
    box-shadow: var(--shadow-sm);
    margin-bottom: 20px;
    transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: #CAD5E2;
  }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  .card-header h2 { margin: 0; }
  .grid { display: grid; gap: 16px; }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

  .tile, .stat-tile {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 20px;
    box-shadow: var(--shadow-sm);
    border-top: 3px solid var(--brand);
    transition: transform .2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow .2s cubic-bezier(0.16, 1, 0.3, 1), border-color .2s ease;
  }
  .stat-tile:hover, .tile:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: #CFD6DE;
  }
  .stat-tile.accent-purple { border-top-color: var(--accent1); }
  .stat-tile.accent-blue { border-top-color: var(--accent2); }
  .stat-tile.accent-amber { border-top-color: var(--accent3); }
  .stat-tile.accent-green { border-top-color: var(--accent4); }
  .stat-tile.accent-red { border-top-color: var(--accent5); }
  .tile b, .stat-tile b { display: block; font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .tile span, .stat-tile span { color: var(--muted); font-size: 13px; font-weight: 500; margin-top: 4px; display: block; }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .row .grow { flex: 1; min-width: 200px; }
  .sub { color: var(--muted); font-size: 13px; }

  /* ===== CHIPS ===== */
  .chip {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    background: var(--info-bg);
    color: var(--brand-dark);
    border: 1px solid rgba(11, 110, 117, 0.15);
  }
  .chip.ok { background: var(--ok-bg); color: var(--ok); border-color: rgba(31, 122, 77, 0.2); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); border-color: rgba(138, 90, 0, 0.2); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); border-color: rgba(179, 38, 30, 0.2); }
  /* .empty styles inherited from style.css */
  .callout {
    background: var(--info-bg);
    border: 1px solid #BFDDE0;
    border-radius: 10px;
    padding: 14px 18px;
    margin-bottom: 20px;
    display: flex;
    gap: 14px;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    box-shadow: var(--shadow-xs);
  }

  /* ===== FORMS ===== */
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; color: var(--text); }
  input, select, textarea {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid #CFD6DE;
    border-radius: 8px;
    background: #fff;
    font-size: 13.5px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-glow);
  }
  input[readonly] { background: #EEF1F5; color: var(--muted); }
  textarea { min-height: 90px; resize: vertical; }
  .form2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
  .inline { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; }
  .inline > div { flex: 1; min-width: 160px; }

  /* ===== BARS ===== */
  .bar { height: 9px; background: #E6EAF0; border-radius: 999px; overflow: hidden; box-shadow: inset 0 1px 2px rgba(0,0,0,0.06); }
  .bar > i { display: block; height: 100%; background: linear-gradient(90deg, var(--brand) 0%, #0D828A 100%); border-radius: 999px; transition: width .4s cubic-bezier(0.16, 1, 0.3, 1); }
  .bar.ok > i { background: linear-gradient(90deg, #1F7A4D 0%, #289961 100%); }
  .gapbar { position: relative; height: 11px; background: #E6EAF0; border-radius: 999px; box-shadow: inset 0 1px 2px rgba(0,0,0,0.06); }
  .gapbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, var(--brand) 0%, #0D828A 100%); border-radius: 999px; transition: width .4s ease; }
  .gapbar > u { position: absolute; top: -3px; bottom: -3px; width: 3.5px; background: #D9822B; text-decoration: none; border-radius: 2px; box-shadow: 0 0 4px rgba(217, 130, 43, 0.6); }

  .rate { display: inline-flex; gap: 5px; }
  .dot {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid #CFD6DE;
    background: #fff;
    cursor: pointer;
    font-weight: 600;
    transition: all .15s ease-in-out;
  }
  .dot.on { background: var(--brand); color: #fff; border-color: var(--brand); box-shadow: 0 2px 4px rgba(11, 110, 117, 0.25); }
  .dot:hover { border-color: var(--brand); transform: translateY(-1px); }

  /* ===== TABLES ===== */
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { background: #F8FAFC; color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .4px; border-top: 1px solid var(--line); }
  th:first-child { border-top-left-radius: 6px; }
  th:last-child { border-top-right-radius: 6px; }
  tr:hover td { background: #F8FAFC; }
  .unread { border-left: 4px solid var(--brand); padding-left: 12px; }
  input[type=range] { padding: 0; accent-color: var(--brand); }

  /* ===== SKILL CARDS & ASSESSMENTS ===== */
  .skillcard {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px 18px;
    margin: 12px 0;
    background: #fff;
    box-shadow: var(--shadow-xs);
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  .skillcard:hover { box-shadow: var(--shadow-sm); border-color: #B4BECB; }
  .skillcard > summary { cursor: pointer; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; list-style: none; font-weight: 600; font-size: 15px; }
  .skillcard > summary::-webkit-details-marker { display: none; }
  .skillcard > summary::before { content: "▸"; color: var(--muted); font-size: 13px; }
  .skillcard[open] > summary::before { content: "▾"; }
  .skillcard ol, .skillcard ul { margin: 8px 0 12px 20px; padding: 0; line-height: 1.6; }
  .skillcard h4 { margin: 12px 0 4px; font-size: 12.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; font-weight: 600; }
  .chips .chip { margin: 0 6px 6px 0; }
  .qgroup { margin-top: 20px; }
  .qgroup h3 { margin: 0 0 6px; font-size: 16px; display: flex; gap: 10px; align-items: center; }
  .missed { border-left: 3px solid #E5B3AF; padding: 6px 0 6px 14px; margin: 12px 0; background: #FFF8F8; border-radius: 0 6px 6px 0; }
  .aibadge { background: var(--ink); color: #fff; border-radius: 999px; padding: 2px 10px; font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 5px; }

  /* ===== TOAST ===== */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #1A2433;
    color: #fff;
    padding: 12px 20px;
    border-radius: 8px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    max-width: 90vw;
    z-index: 100;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    font-size: 13.5px;
    font-weight: 500;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(-2px); }
  #toast.err { background: var(--bad); }

  /* ===== RECOMMENDATION CARDS ===== */
  .rec-card {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    background: #fff;
    box-shadow: var(--shadow-xs);
    transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    margin-bottom: 12px;
  }
  .rec-card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
    border-color: #B4BECB;
  }

  /* ===== ASK-AI CHAT ===== */
  .chat-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .chat-head .sub { margin: 2px 0 12px; }
  .chat-log {
    height: 380px;
    overflow-y: auto;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    background: #F8FAFB;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { max-width: 86%; padding: 11px 15px; border-radius: 10px; font-size: 14px; line-height: 1.55; overflow-wrap: anywhere; }
  .msg.user { align-self: flex-end; background: var(--brand); color: #fff; white-space: pre-wrap; box-shadow: 0 2px 6px rgba(11, 110, 117, 0.25); }
  .msg.bot { align-self: flex-start; background: #fff; border: 1px solid var(--line); box-shadow: var(--shadow-xs); }
  .msg.err { border-color: #E5B3AF; background: var(--bad-bg); }
  .msg p { margin: 0 0 6px; } .msg p:last-child { margin-bottom: 0; }
  .msg ul, .msg ol { margin: 4px 0 6px 20px; padding: 0; }
  .msg pre { background: var(--ink); color: #E8EEF5; padding: 10px 12px; border-radius: 6px; overflow-x: auto; font-size: 13px; margin: 6px 0; }
  .msg code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .92em; background: #EEF1F5; padding: 1px 4px; border-radius: 3px; }
  .msg pre code { background: none; padding: 0; }
  .msg .src { font-size: 11px; color: var(--muted); margin-top: 6px; }
  .typing i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #98A4B3; margin-right: 4px; animation: blink 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .typing i { animation: none; } }
  .chat-suggest { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .chipbtn { border: 1px solid #9DB9BC; background: #fff; color: var(--brand-dark); cursor: pointer; font: inherit; font-size: 13px; font-weight: 500; padding: 6px 12px; border-radius: 6px; transition: all .15s ease; }
  .chipbtn:hover { background: var(--info-bg); border-color: var(--brand); transform: translateY(-1px); }
  .chat-form { display: flex; gap: 10px; margin-top: 12px; align-items: flex-end; }
  .chat-form textarea { min-height: 44px; height: 44px; resize: none; flex: 1; }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 992px) {
    .form2 { grid-template-columns: 1fr; }
    .who small { display: none; }
  }
  @media (max-width: 520px) {
    .brand span:last-child { display: none; }
    .top .right { gap: 8px; min-width: 0; }
    .who { max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .g4, .g2 { grid-template-columns: 1fr; }
  }
  @media print {
    .top, nav#nav, .noprint, #toast { display: none !important; }
    .layout { display: block; padding: 0; }
    .card, .tile { box-shadow: none; border: 1px solid #ccc; }
    body { background: #fff; }
  }
</style>
</head>
<body data-role="EMPLOYEE">
<!-- custom-page: hand-built, so _generate_dashboards.py will not overwrite it -->
<div id="app" hidden>
<header class="top">
  <div class="brand">
    <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle navigation drawer" aria-expanded="false">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
    </button>
    <span class="logo">WKI</span><span>Workforce<br>Intelligence</span>
  </div>
  <div class="right">
    <button class="bell" id="bell" aria-label="Notifications" title="Notifications">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      <span class="badge" id="badge" hidden>0</span>
    </button>
    <span class="role-badge">&#128100; Employee</span>
    <div class="user-menu-wrap">
      <button class="user-profile-btn" id="userMenuBtn" aria-expanded="false" aria-haspopup="true" title="User account menu">
        <span class="user-avatar" id="userAvatar">U</span>
        <div class="who">
          <strong id="userName">Loading…</strong>
          <small id="userEmail"></small>
        </div>
        <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="user-dropdown" id="userDropdown" hidden>
        <div class="dropdown-header">
          <div class="dropdown-avatar" id="dropdownAvatar">U</div>
          <div class="dropdown-info">
            <strong id="dropdownName">User</strong>
            <span class="dropdown-email" id="dropdownEmail"></span>
            <span class="dropdown-role" id="dropdownRole">Employee</span>
          </div>
        </div>
        <div class="dropdown-divider"></div>
        <div class="dropdown-actions">
          <button type="button" class="dropdown-item" id="logoutDropdownBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            <span>Sign Out</span>
          </button>
        </div>
      </div>
    </div>
    <button class="btn outline-nav" id="logoutBtn">Logout</button>
  </div>
</header>

<div class="layout">
  <nav id="nav" aria-label="Dashboard sections"></nav>
  <main id="main" tabindex="-1"><div class="card empty">Loading your dashboard…</div></main>
</div>
<div id="toast" role="status" aria-live="polite"></div>
</div><!-- /#app -->

<!-- guard.js checks the login token and role, shows #app, and handles the Logout button -->
<script src="js/guard.js"></script>
<!-- Messages: chat icon beside the notification bell + slide-in chat panel (employee-employee after follow/accept, employee-mentor) -->
<script src="js/messages.js"></script>
<script>
/* ============================ CONFIG ============================ */
const CONFIG = {
  API: "http://localhost:8080/api/employee",   // backend base URL
  LOGIN_PAGE: "login.html"                      // where to send people who are not logged in (same as guard.js)
};

/* ============================ HELPERS =========================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const LEVELS = ["", "Beginner", "Basic", "Intermediate", "Advanced", "Expert"];
// Same session object that login.html / auth.js saves (see js/auth.js)
function getSession() {
  try { return JSON.parse(localStorage.getItem("wki_session") || "null"); } catch (_) { return null; }
}
function goLogin() {
  try { localStorage.removeItem("wki_session"); } catch (_) {}
  window.location.replace(CONFIG.LOGIN_PAGE);
}
function toast(msg, isErr) {
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (isErr ? " err" : "");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.className = "", 3200);
}
async function api(path, { method = "GET", body } = {}) {
  const sess = getSession();
  if (!sess || !sess.token) { goLogin(); throw new Error("Please log in"); }
  let res;
  try {
    res = await fetch(CONFIG.API + path, {
      method,
      headers: { Authorization: "Bearer " + sess.token, ...(body ? { "Content-Type": "application/json" } : {}) },
      body: body ? JSON.stringify(body) : undefined
    });
  } catch (_) { throw new Error("Cannot reach the server. Is the backend running at " + CONFIG.API + " ?"); }
  if (res.status === 401) { goLogin(); throw new Error("Session expired, please log in again"); }
  const data = await res.json().catch(() => null);
  if (!res.ok) {
    if (res.status === 403 && !(data && data.message)) throw new Error("Access denied. This dashboard is only for Employee accounts.");
    throw new Error((data && (data.message || data.error)) || "Request failed (" + res.status + ")");
  }
  return data;
}
function fmt(dt, withTime = true) {
  if (!dt) return "";
  const d = new Date(dt); if (isNaN(d)) return "";
  return d.toLocaleString([], withTime ? { dateStyle: "medium", timeStyle: "short" } : { dateStyle: "medium" });
}
const cleanLast = n => (n && n !== "-") ? n : "";
const fullName = p => [p.firstName, cleanLast(p.lastName)].filter(Boolean).join(" ");
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;

/* ============================ STATE ============================= */
const S = { assessmentQuestions: [], assessmentHistory: [], assessmentSkillId: null, lastAssessment: null,
  roles: { roles: [] }, roleChoice: null, roleQuestions: [], roleQuestionsRoleId: null, roleResult: null, latestRole: { exists: false },
  ai: null, aiLoading: false, aiError: null };
const loaders = {
  profile:     async () => S.profile     = await api("/me/profile"),
  skills:      async () => S.skills      = await api("/me/skills"),
  catalog:     async () => S.catalog     = await api("/skills"),
  assessmentHistory: async () => S.assessmentHistory = await api("/me/assessment/history"),
  gaps:        async () => S.gaps        = await api("/me/gaps"),
  recs:        async () => S.recs        = await api("/me/recommendations"),
  learning:    async () => S.learning    = await api("/me/learning"),
  mentorships: async () => S.mentorships = await api("/me/mentorships"),
  suggestions: async () => S.suggestions = await api("/me/mentor-suggestions"),
  mentors:     async () => S.mentors     = await api("/me/mentors"),
  sessions:    async () => S.sessions    = await api("/sessions"),
  notifs:      async () => S.notifs      = await api("/me/notifications"),
  certs:       async () => S.certs       = await api("/me/certifications"),
  achievements:async () => S.achievements= await api("/me/achievements"),
  roles:       async () => { try { S.roles = await api("/me/job-roles"); } catch (_) { S.roles = { roles: [], failed: true }; } },
  latestRole:  async () => { try { S.latestRole = await api("/me/role-assessment/latest"); } catch (_) { S.latestRole = { exists: false }; } }
};
const refresh = (...names) => Promise.all((names.length ? names : Object.keys(loaders)).map(n => loaders[n]()));

/* ============================ UI PIECES ========================= */
const NAV_SECTIONS = [
  {
    title: "My Development",
    items: [
      ["overview", "Overview", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>`],
      ["profile", "My Profile", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`],
      ["skills", "My Skills", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>`],
      ["assessment", "Skill Assessments", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>`],
      ["gaps", "Knowledge Gaps", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>`]
    ]
  },
  {
    title: "Learning & Growth",
    items: [
      ["recommended", "Recommended Training", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`],
      ["progress", "Learning Progress", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>`],
      ["certifications", "Certifications", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="8" r="7"/><polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/></svg>`],
      ["achievements", "Progress & Achievements", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`]
    ]
  },
  {
    title: "Collaboration & Insights",
    items: [
      ["community", "Sharing & Mentorship", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>`],
      ["notifications", "Notifications", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>`],
      ["reports", "Reports", `<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>`]
    ]
  }
];
const VIEWS = NAV_SECTIONS.flatMap(s => s.items.map(([id, label]) => [id, label]));
let current = "overview";

const tile = (n, label, icon = "📊", cls = "") => `<div class="stat-tile ${cls}"><b>${esc(n)}</b><span>${esc(label)}</span><span class="tile-icon">${icon}</span></div>`;
const empty = (msg, btn) => `<div class="empty">${esc(msg)}${btn || ""}</div>`;
const goBtn = (view, label) => `<div style="margin-top:12px"><button class="btn small" data-act="go" data-view="${view}">${esc(label)}</button></div>`;
const progressBar = (p, cls = "") => `<div class="bar ${cls}" role="progressbar" aria-valuenow="${Number(p)}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Number(p)}%"></i></div>`;
const ringProgress = (p, color = "var(--brand)", size = 64) => {
  const r = size * 0.38, c = 2 * Math.PI * r;
  const off = c - (Math.min(100, Math.max(0, Number(p))) / 100) * c;
  return `<div class="circle-progress" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <circle class="bg" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="5.5" fill="none"/>
      <circle class="val" cx="${size/2}" cy="${size/2}" r="${r}" stroke-width="5.5" fill="none" stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
    </svg>
    <span class="label" style="font-size:${size * 0.22}px">${Math.round(p)}%</span>
  </div>`;
};
const head = (title, lead) => `<h1>${esc(title)}</h1><p class="lead">${esc(lead)}</p>`;
const gapChip = g => g >= 2 ? `<span class="chip bad">High gap</span>` : g === 1 ? `<span class="chip warn">Small gap</span>` : `<span class="chip ok">On target</span>`;
const rater = (id, cur) => `<div class="rate" role="group" aria-label="Your level">${[1, 2, 3, 4, 5].map(n =>
  `<button type="button" class="dot${n <= cur ? " on" : ""}" data-act="rate" data-skill="${Number(id)}" data-level="${n}" aria-pressed="${n === cur}" title="${n} – ${LEVELS[n]}">${n}</button>`).join("")}</div>`;

/* ===== role assessment + AI helpers ===== */
const scoreLine = c => {
  if (c.scorePct == null) return "";
  const withMarks = c.marksMax != null && c.marksEarned != null && Math.abs(Number(c.marksEarned) * 100 / Number(c.marksMax) - Number(c.scorePct)) < 0.6;
  return `<div class="sub">Why: you scored ${mk(c.scorePct)}% in ${esc(c.skillName)}${withMarks ? " (" + mk(c.marksEarned) + " of " + Number(c.marksMax) + " marks)" : ""}.</div>`;
};
const mk = n => (Math.round(Number(n) * 10) / 10).toString();
const roleById = id => (S.roles.roles || []).find(r => Number(r.roleId) === Number(id));
function roleChoiceId() {
  const R = S.roles;
  return S.roleChoice ?? R.selectedRoleId ?? R.suggestedRoleId ?? ((R.roles || [])[0] || {}).roleId;
}
function roleCardHtml() {
  const R = S.roles, roles = R.roles || [];
  if (!roles.length) return `<div class="card"><h2>Role-based assessment</h2>${empty(R.failed ? "Role assessments are not available yet. Restart the backend and check the console for 'RoleAssessmentSchema'." : "No roles are set up yet.")}</div>`;
  const id = roleChoiceId(), role = roleById(id);
  const hint = R.selectedRoleId ? "" : R.suggestedRoleId ? `<p class="sub">We pre-selected this role because it matches the job role in your profile.</p>` : "";
  return `<form class="card" data-form="roleselect"><h2>Role-based assessment</h2>
    <p class="sub">Choose your job role. The assessment covers the skills that role needs, and every skill carries a share of the 100 marks, so we can see exactly where you lose marks.</p>${hint}
    <div class="inline"><div><label for="roleSel">My role</label><select id="roleSel" name="roleId" data-roleselect>${roles.map(r => `<option value="${Number(r.roleId)}"${Number(r.roleId) === Number(id) ? " selected" : ""}>${esc(r.roleName)}</option>`).join("")}</select></div>
    <div style="flex:0"><button class="btn" type="submit">Start role assessment</button></div></div>
    ${role ? `<p class="sub" style="margin-top:12px">${esc(role.description || "")}</p><div class="chips">${role.skills.map(k => `<span class="chip">${esc(k.skillName)} · ${Number(k.weightPct)} marks</span>`).join("")}</div>` : ""}</form>`;
}
function roleQuestionsHtml() {
  const qs = S.roleQuestions, role = roleById(S.roleQuestionsRoleId);
  if (!qs.length || !role) return "";
  const groups = [];
  qs.forEach(q => { let g = groups.find(x => x.skillId === q.skillId); if (!g) groups.push(g = { skillId: q.skillId, skillName: q.skillName, weight: q.weightPct, items: [] }); g.items.push(q); });
  let n = 0;
  return `<form class="card" data-form="roleassessment"><h2>${esc(role.roleName)} assessment</h2>
    <p class="sub">${qs.length} questions · 100 marks in total. Answer every question. Marks are shared between skills as shown.</p>
    ${groups.map(g => `<div class="qgroup"><h3>${esc(g.skillName)} <span class="chip">${Number(g.weight)} marks</span></h3>
      ${g.items.map(q => { n++; return `<fieldset style="border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0"><legend><b>${n}. ${esc(q.questionText)}</b></legend><p class="sub">Topic: ${esc(q.topic)}</p>${["A","B","C","D"].map(l => `<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input style="width:auto;margin-top:4px" type="radio" name="rq_${Number(q.questionId)}" value="${l}" required> <span>${l}. ${esc(q["option" + l])}</span></label>`).join("")}</fieldset>`; }).join("")}</div>`).join("")}
    <button class="btn" type="submit">Submit assessment</button></form>`;
}
function roleResultHtml() {
  const r = S.roleResult || (S.latestRole && S.latestRole.exists ? S.latestRole : null);
  if (!r) return "";
  const overall = Number(r.overallPct);
  return `<div class="card"><h2>${S.roleResult ? "Your result" : "Latest role result"}: ${esc(r.roleName)}</h2>
    <div class="sub" style="margin-bottom:10px">${esc(fmt(r.takenAt))}</div>
    <div class="grid g4"><div class="tile"><b>${mk(overall)}/100</b><span>Total marks</span></div><div class="tile"><b>${Number(r.gapCount)}</b><span>Skills with a gap</span></div><div class="tile"><b>${(r.skills || []).length - Number(r.gapCount)}</b><span>Skills on target</span></div></div>
    <h2 style="margin-top:20px">Marks by skill</h2>
    ${(r.skills || []).map(k => `<div class="row"><div class="grow"><b>${esc(k.skillName)}</b> ${k.gap ? `<span class="chip bad">Gap</span>` : `<span class="chip ok">On target</span>`}
      <div class="sub">You earned <b>${mk(k.marksEarned)}</b> of ${Number(k.weightPct)} marks (${mk(k.skillPct)}% of this skill) · ${Number(k.correct)}/${Number(k.total)} correct</div>
      <div style="margin:8px 0 2px;max-width:420px">${progressBar(Number(k.skillPct), k.gap ? "" : "ok")}</div>
      ${k.gap && (k.weakTopics || []).length ? `<div class="sub">Weak topics: ${k.weakTopics.map(esc).join(", ")}</div>` : ""}</div></div>`).join("")}
    <p style="margin-top:14px">Courses for the skills where you lost marks are now in <button class="btn ghost small" data-act="go" data-view="recommended">Recommended Training</button>, together with your AI study plan.</p>
    ${(r.skills || []).some(k => (k.missed || []).length) ? `<details style="margin-top:8px"><summary style="cursor:pointer;font-weight:600">Review the questions you missed</summary>${(r.skills || []).map(k => (k.missed || []).map(m => `<div class="missed"><b>${esc(k.skillName)} · ${esc(m.topic)}</b><div>${esc(m.questionText)}</div><div class="sub">Your answer: ${esc(m.yourAnswer)}</div><div class="sub">Correct answer: ${esc(m.correctAnswer)}</div><div class="sub">${esc(m.explanation || "")}</div></div>`).join("")).join("")}</details>` : ""}
  </div>`;
}
function aiHtml() {
  const a = S.ai;
  const refresh = `<button class="btn ghost small noprint" data-act="airefresh"${S.aiLoading ? " disabled" : ""}>Regenerate</button>`;
  let body;
  if (S.aiLoading) body = `<div class="empty">Analysing your assessment results and building your plan… this can take up to a minute.</div>`;
  else if (S.aiError) body = `<div class="empty">Could not load recommendations: ${esc(S.aiError)}</div>`;
  else if (!a) body = `<div class="empty">Loading…</div>`;
  else if (a.ready === false) body = empty(a.message || "Take a role assessment first.", goBtn("assessment", "Take role assessment"));
  else {
    const isAi = a.source === "AI";
    const skills = a.skills || [];
    body = `<div style="margin-bottom:10px"><span class="chip ${isAi ? "aibadge" : ""}">${isAi ? "✨ Written by AI (Claude)" : "Built-in recommendation engine"}</span> <span class="sub">for ${esc(a.roleName || "")}</span></div>
      <p>${esc(a.summary || "")}</p>${a.note ? `<p class="sub">${esc(a.note)}</p>` : ""}
      ${skills.length ? skills.map((k, i) => `<details class="skillcard"${i === 0 ? " open" : ""}><summary><b>${esc(k.skillName)}</b>
          <span class="chip ${k.priority === "high" ? "bad" : k.priority === "medium" ? "warn" : ""}">${esc(k.priority || "")} priority</span>
          <span class="sub">${mk(k.marksEarned)} / ${Number(k.weightPct)} marks · about ${Number(k.estimatedHours)} hours to close the gap</span></summary>
        <p>${esc(k.why || "")}</p>
        ${(k.focusTopics || []).length ? `<h4>Focus on</h4><div class="chips">${k.focusTopics.map(t => `<span class="chip warn">${esc(t)}</span>`).join("")}</div>` : ""}
        ${(k.studyPlan || []).length ? `<h4>Study plan</h4><ol>${k.studyPlan.map(t => `<li>${esc(t)}</li>`).join("")}</ol>` : ""}
        ${(k.practice || []).length ? `<h4>Practice</h4><ul>${k.practice.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
        ${(k.courses || []).length ? `<h4>Courses available here</h4><div class="chips">${k.courses.map(t => `<span class="chip">${esc(t)}</span>`).join("")}</div>` : ""}
        ${(k.links || []).length ? `<h4>Reference</h4>${k.links.map(l => /^https:\/\//.test(l.url) ? `<a href="${esc(l.url)}" target="_blank" rel="noopener noreferrer">${esc(l.title)}</a>` : "").join(" · ")}` : ""}
      </details>`).join("") : `<div class="sub">No lacking skills found.</div>`}
      ${(a.nextSteps || []).length ? `<h4 style="margin:16px 0 4px;font-size:13px;color:var(--muted);text-transform:uppercase">Next steps this week</h4><ul>${a.nextSteps.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}`;
  }
  return `<div class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap"><h2 style="margin:0">AI recommendations for your lacking skills</h2>${refresh}</div><div style="margin-top:10px">${body}</div></div>`;
}
async function ensureAi(force) {
  if (S.aiLoading) return;
  if (S.ai && !force) return;
  S.aiLoading = true; S.aiError = null;
  if (current === "recommended") render();
  try { S.ai = force ? await api("/me/ai-recommendations/refresh", { method: "POST" }) : await api("/me/ai-recommendations"); }
  catch (e) { S.aiError = e.message; }
  S.aiLoading = false;
  if (current === "recommended") render();
}

/* ============================ VIEWS ============================= */
const views = {
  overview() {
    const g = S.gaps.summary, l = S.learning.summary;
    const topGaps = S.gaps.gaps.slice(0, 3), recs = S.recs.courses.slice(0, 3);
    const sess = S.sessions.slice(0, 3);
    const sessUser = getSession();
    const empName = (S.profile && S.profile.firstName)
      ? (S.profile.firstName + (S.profile.lastName ? " " + S.profile.lastName : ""))
      : (sessUser && sessUser.fullName ? sessUser.fullName : "Employee");
    return head(`Welcome back to the Employee Dashboard, ${empName}!`, "Here is where you stand today.") +
      (g.assessed === 0 ? `<div class="callout"><span><b>Start here:</b> choose your job role and take the role assessment so we can find your skill gaps, recommend courses and give you AI study advice.</span><button class="btn small" data-act="go" data-view="assessment">Take role assessment</button></div>` : "") +
      `<div class="grid g4" style="margin-bottom:18px">${tile(g.assessed, "Skills assessed", "🎯", "accent-purple")}${tile(g.gapCount, "Open knowledge gaps", "⚠️", "accent-red")}${tile(l.inProgress, "Courses in progress", "📚", "accent-blue")}${tile(S.notifs.unread, "Unread notifications", "🔔", "accent-green")}</div>
      <div class="grid g2">
        <div class="card"><h2>Biggest gaps</h2>${topGaps.length ? topGaps.map(x => `<div class="row"><span class="grow"><b>${esc(x.skillName)}</b><div class="sub">You ${x.selfLevel} · Target ${x.requiredLevel}</div></span>${gapChip(x.gap)}</div>`).join("") : empty("No gaps found yet.")}${goBtn("gaps", "View all gaps")}</div>
        <div class="card"><h2>Recommended for you</h2>${recs.length ? recs.map(c => `<div class="row"><span class="grow"><b>${esc(c.title)}</b><div class="sub">${esc(c.skillName)} · ${Number(c.durationHours)}h</div></span></div>`).join("") : empty("Nothing to recommend yet.")}${goBtn("recommended", "See training")}</div>
        <div class="card"><h2>Upcoming sessions</h2>${sess.length ? sess.map(x => `<div class="row"><span class="grow"><b>${esc(x.title)}</b><div class="sub">${esc(fmt(x.scheduledAt))} · ${esc(x.hostName)}</div></span></div>`).join("") : empty("No sessions scheduled.")}${goBtn("community", "Open sharing & mentorship")}</div>
      </div>`;
  },

  profile() {
    const p = S.profile;
    const filled = ["phone", "location", "bio", "linkedin", "education", "workExperience", "department", "jobRole"].filter(k => p[k]).length;
    const done = pct(filled, 8);
    const ringColor = done >= 80 ? "var(--ok)" : done >= 40 ? "var(--brand)" : "var(--warn)";
    return head("My Profile", "Keep your details up to date so colleagues can find and reach you.") +
      `<div class="card" style="display:flex;align-items:center;gap:20px;flex-wrap:wrap">
        ${ringProgress(done, ringColor, 68)}
        <div style="flex:1;min-width:220px">
          <div style="font-weight:600;font-size:15px;color:var(--ink);margin-bottom:2px">Profile Completeness (${done}%)</div>
          <div class="sub" style="margin-bottom:8px">${filled} of 8 details completed. A complete profile helps peers and mentors connect with you.</div>
          ${progressBar(done)}
        </div>
      </div>
      <form class="card" data-form="profile">
        <h2>Personal Details</h2>
        <div class="form2">
          <div><label for="f_first">First name</label><input id="f_first" name="firstName" required maxlength="100" value="${esc(p.firstName)}"></div>
          <div><label for="f_last">Last name</label><input id="f_last" name="lastName" maxlength="100" value="${esc(cleanLast(p.lastName))}"></div>
          <div><label for="f_email">Email (cannot be changed here)</label><input id="f_email" value="${esc(p.email)}" readonly></div>
          <div><label for="f_phone">Phone</label><input id="f_phone" name="phone" maxlength="30" value="${esc(p.phone)}"></div>
          <div><label for="f_loc">Location</label><input id="f_loc" name="location" maxlength="100" value="${esc(p.location)}"></div>
          <div><label for="f_li">LinkedIn / profile link</label><input id="f_li" name="linkedin" maxlength="255" value="${esc(p.linkedin)}"></div>
        </div>
        <h2 style="margin-top:20px">Professional Details</h2>
        <div class="form2">
          <div><label for="f_dept">Department</label><input id="f_dept" name="department" maxlength="100" value="${esc(p.department)}"></div>
          <div><label for="f_role">Job Role</label><input id="f_role" name="jobRole" maxlength="100" value="${esc(p.jobRole)}"></div>
        </div>
        <label for="f_edu">Education</label><textarea id="f_edu" name="education" maxlength="500" placeholder="e.g. B.Tech Computer Science, XYZ University, 2020">${esc(p.education)}</textarea>
        <label for="f_exp">Work Experience</label><textarea id="f_exp" name="workExperience" maxlength="1000" placeholder="e.g. 3 years as Full Stack Developer at ABC Corp">${esc(p.workExperience)}</textarea>
        <label for="f_bio">About me</label><textarea id="f_bio" name="bio" maxlength="1000">${esc(p.bio)}</textarea>
        <div style="margin-top:16px"><button class="btn" type="submit">Save profile</button> <span class="chip ${p.status === "ACTIVE" ? "ok" : "warn"}">${esc(p.status)}</span>${p.role ? ` <span class="chip">${esc(p.role)}</span>` : ""}</div>
      </form>`;
  },

  skills() {
    const have = new Set(S.skills.map(s => s.skillId));
    const avail = S.catalog.filter(s => !have.has(s.skillId));
    const cats = [...new Set(avail.map(s => s.category))];
    return head("My Skills", "Add the skills you want to demonstrate. We use a knowledge assessment—not a self-selected level—to identify gaps and recommend courses.") +
      `<form class="card" data-form="addskill"><h2>Add a skill to assess</h2>
        ${avail.length ? `<div class="inline"><div><label for="a_skill">Skill</label><select id="a_skill" name="skillId" required>${cats.map(c => `<optgroup label="${esc(c)}">${avail.filter(s => s.category === c).map(s => `<option value="${Number(s.skillId)}">${esc(s.skillName)}</option>`).join("")}</optgroup>`).join("")}</select></div><div style="flex:0"><button class="btn" type="submit">Add skill</button></div></div>` : `<div class="sub">You have added every skill in the catalogue.</div>`}
      </form>
      <div class="card"><h2>My selected skills</h2>
        ${S.skills.length ? `<div class="tablewrap"><table><thead><tr><th>Skill</th><th>Category</th><th>Latest assessment</th><th>Assessment status</th><th>Action</th></tr></thead><tbody>
          ${S.skills.map(s => `<tr><td><b>${esc(s.skillName)}</b></td><td>${esc(s.category)}</td><td>${s.assessmentPercent == null ? "—" : Number(s.assessmentPercent) + "%"}</td><td>${s.assessmentPercent == null ? `<span class="chip warn">Not assessed</span>` : Number(s.assessmentPercent) >= 75 ? `<span class="chip ok">Strong result</span>` : `<span class="chip bad">Learning gap found</span>`}</td><td><button class="btn small" data-act="startassessment" data-skill="${Number(s.skillId)}">${s.assessmentPercent == null ? "Take assessment" : "Retake assessment"}</button> <button class="btn danger small" data-act="removeskill" data-skill="${Number(s.skillId)}">Remove</button></td></tr>`).join("")}
        </tbody></table></div>` : empty("Add a skill to begin your first assessment.")}
      </div>
      <div class="card"><h2>Assessment history</h2>${(S.assessmentHistory || []).length ? (S.assessmentHistory).map(a => `<div class="row"><div class="grow"><b>${esc(a.skillName)}</b><div class="sub">${esc(fmt(a.attemptedAt))} · ${Number(a.correctAnswers)}/${Number(a.totalQuestions)} correct</div></div><b>${Number(a.scorePct)}%</b></div>`).join("") : empty("Your completed assessments will appear here.")}</div>`;
  },

  assessment() {
    const skills = S.skills || [];
    const roleBlock = roleCardHtml() + roleQuestionsHtml() + roleResultHtml();
    const chosen = skills.find(s => Number(s.skillId) === Number(S.assessmentSkillId));
    let content = `<form class="card" data-form="startassessment"><h2>Choose a skill</h2><p class="sub">Questions are selected from the assessment bank. Your score is calculated from your answers.</p><div class="inline"><div><label for="assessmentSkill">Skill</label><select id="assessmentSkill" name="skillId" required>${skills.map(s => `<option value="${Number(s.skillId)}"${Number(s.skillId) === Number(S.assessmentSkillId) ? " selected" : ""}>${esc(s.skillName)}</option>`).join("")}</select></div><div style="flex:0"><button class="btn" type="submit" ${skills.length ? "" : "disabled"}>Load assessment</button></div></div>${skills.length ? "" : empty("Add a skill first.", goBtn("skills", "Go to My Skills"))}</form>`;
    if (S.assessmentQuestions && S.assessmentQuestions.length && chosen) {
      content += `<form class="card" data-form="assessment"><h2>${esc(chosen.skillName)} assessment</h2><p class="sub">Answer every question. The result will update your knowledge-gap summary and course recommendations.</p>
        ${S.assessmentQuestions.map((q,i) => `<fieldset style="border:1px solid var(--line);border-radius:10px;padding:14px;margin:14px 0"><legend><b>${i+1}. ${esc(q.questionText)}</b></legend><p class="sub">Topic: ${esc(q.topic)}</p>${["A","B","C","D"].map(letter => `<label style="display:flex;gap:8px;align-items:flex-start;font-weight:400"><input style="width:auto;margin-top:4px" type="radio" name="q_${Number(q.questionId)}" value="${letter}" required> <span>${letter}. ${esc(q["option"+letter])}</span></label>`).join("")}</fieldset>`).join("")}
        <button class="btn" type="submit">Submit assessment</button></form>`;
    }
    if (S.lastAssessment) {
      const r=S.lastAssessment;
      content += `<div class="card"><h2>Latest result: ${esc(r.skillName)}</h2><div class="grid g4"><div class="tile"><b>${Number(r.scorePct)}%</b><span>Assessment score</span></div><div class="tile"><b>${Number(r.correctAnswers)}/${Number(r.totalQuestions)}</b><span>Correct answers</span></div><div class="tile"><b>${Number(r.assessedLevel)}/5</b><span>Evidence-based skill level</span></div></div><p>Recommendations are now based on your assessed performance. Review your <button class="btn ghost small" data-act="go" data-view="recommended">recommended courses</button>.</p>${(r.answerReview||[]).map((a,i)=>`<div class="row"><div class="grow"><b>Question ${i+1}: ${a.isCorrect ? "Correct" : "Review this topic"}</b><div class="sub">${esc(a.topic)} — ${esc(a.explanation||"")}</div></div><span class="chip ${a.isCorrect ? "ok" : "bad"}">${a.isCorrect ? "Correct" : "Incorrect"}</span></div>`).join("")}</div>`;
    }
    return head("Skill Assessments", "Measure actual knowledge through questions. Scores identify specific gaps and drive personalized course recommendations.") + roleBlock +
      `<h2 style="margin:26px 0 10px">Single-skill practice</h2>` + content;
  },

  gaps() {
    const { summary: g, gaps, strengths } = S.gaps;
    if (!g.assessed) return head("Knowledge Gap Summary", "Where your skills fall short of the target level.") + `<div class="card">${empty("Complete a skill assessment first to see your gaps.", goBtn("skills", "Rate my skills"))}</div>`;
    return head("Knowledge Gap Summary", "Where your skills fall short of the target level for your role.") +
      `<div class="grid g4" style="margin-bottom:18px">${tile(g.gapCount, "Skills with a gap")}${tile(g.strengthCount, "Skills on target")}${tile(g.avgSelf, "Average assessed level")}${tile(g.totalGapPoints, "Total gap points")}</div>
      <div class="card"><h2>Skills to develop</h2>
        ${gaps.length ? gaps.map(x => `<div class="row"><div class="grow"><b>${esc(x.skillName)}</b> <span class="sub">${esc(x.category)}</span>
          <div class="gapbar" style="margin:8px 0 4px" role="img" aria-label="Assessed level ${x.selfLevel} of 5, target ${x.requiredLevel}"><i style="width:${x.selfLevel * 20}%"></i><u style="left:calc(${x.requiredLevel * 20}% - 1px)"></u></div>
          <span class="sub">Assessed level: ${x.selfLevel} (${esc(LEVELS[x.selfLevel])}) · Target: ${x.requiredLevel} (${esc(LEVELS[x.requiredLevel])}) · Gap: ${x.gap}</span></div>${gapChip(x.gap)}</div>`).join("") : empty("Great news, you meet the target on every assessed skill!")}
        ${gaps.length ? goBtn("recommended", "Find training for these gaps") : ""}
      </div>
      <div class="card"><h2>Your strengths</h2>${strengths.length ? strengths.map(x => `<span class="chip ok" style="margin:0 6px 6px 0">${esc(x.skillName)} · ${x.selfLevel}/5</span>`).join("") : empty("No strengths recorded yet.")}</div>`;
  },

  recommended() {
    const { courses, paths } = S.recs;
    return head("Recommended Training & Learning Paths", "Picked from the skills where you lost marks in your assessments.") + aiHtml() +
      `<div class="card"><h2>Recommended courses</h2>
        ${courses.length ? courses.map(c => `<div class="row"><div class="grow"><b>${esc(c.title)}</b><div class="sub">${esc(c.provider || "")} · Skill: ${esc(c.skillName)} · Level ${Number(c.courseLevel)} · ${Number(c.durationHours)} hours</div>${scoreLine(c)}</div><span class="chip warn">Closes a ${Number(c.gap)}-level gap</span><button class="btn small" data-act="enroll" data-course="${Number(c.courseId)}">Enroll</button></div>`).join("")
          : empty(S.gaps.summary.assessed ? "No new courses to recommend right now." : "Complete a skill assessment to get personalised recommendations.", S.gaps.summary.assessed ? "" : goBtn("skills", "Rate my skills"))}
      </div>
      <div class="card"><h2>Learning paths</h2>
        ${paths.length ? paths.map(p => { const pr = pct(p.completedCourses, p.totalCourses); return `<div class="row"><div class="grow"><b>${esc(p.title)}</b> ${p.gapMatches > 0 ? `<span class="chip">Covers ${Number(p.gapMatches)} of your gaps</span>` : ""}
          <div class="sub">${esc(p.description || "")}</div><div style="margin:8px 0 2px;max-width:340px">${progressBar(pr, pr === 100 ? "ok" : "")}</div><div class="sub">${Number(p.completedCourses)} of ${Number(p.totalCourses)} courses completed</div></div>
          <button class="btn ghost small" data-act="enrollpath" data-path="${Number(p.pathId)}">${p.completedCourses === p.totalCourses && p.totalCourses ? "Completed" : "Start path"}</button></div>`; }).join("") : empty("No learning paths available yet.")}
      </div>`;
  },

  progress() {
    const { summary: l, items } = S.learning;
    return head("Learning Progress", "Track the courses you have started and finished.") +
      `<div class="grid g4" style="margin-bottom:18px">${tile(l.enrolled, "Courses enrolled")}${tile(l.inProgress, "In progress")}${tile(l.completed, "Completed")}${tile(l.hoursCompleted, "Learning hours completed")}</div>
      <div class="card"><h2>My courses</h2>
        ${items.length ? items.map(i => `<div class="row"><div class="grow"><b>${esc(i.title)}</b> ${i.status === "COMPLETED" ? `<span class="chip ok">Completed</span>` : `<span class="chip">In progress</span>`}
          <div class="sub">${esc(i.provider || "")} · ${esc(i.skillName)} · ${Number(i.durationHours)}h · Started ${esc(fmt(i.startedAt, false))}${i.completedAt ? " · Finished " + esc(fmt(i.completedAt, false)) : ""}</div>
          <div style="margin:8px 0 2px;max-width:420px">${progressBar(i.progressPct, i.status === "COMPLETED" ? "ok" : "")}</div><span class="sub" id="pv_${Number(i.courseId)}">${Number(i.progressPct)}% complete</span></div>
          ${i.status === "COMPLETED" ? "" : `<div class="inline noprint" style="max-width:340px"><div style="min-width:140px"><label class="sub" for="r_${Number(i.courseId)}" style="margin:0">Update progress</label><input type="range" id="r_${Number(i.courseId)}" min="0" max="95" step="5" value="${Math.min(Number(i.progressPct), 95)}" data-range="${Number(i.courseId)}"></div>
          <button class="btn small" data-act="saveprogress" data-course="${Number(i.courseId)}">Save</button><button class="btn ghost small" data-act="complete" data-course="${Number(i.courseId)}">Mark complete</button></div>`}</div>`).join("")
          : empty("You have not enrolled in any courses yet.", goBtn("recommended", "Browse recommended training"))}
      </div>`;
  },

  community() {
    const ms = S.mentorships, sug = S.suggestions, ses = S.sessions, mtr = S.mentors || [];
    const stat = s => ({ REQUESTED: ["warn", "Pending"], ACTIVE: ["ok", "Active"], DECLINED: ["bad", "Declined"], COMPLETED: ["", "Completed"] }[s] || ["", s]);
    return head("Knowledge Sharing & Mentorship", "Learn from colleagues and share what you know.") +
      `<div class="card"><h2>My mentorships</h2>
        ${ms.length ? ms.map(m => { const [c, t] = stat(m.status); const iMentor = m.myRole === "MENTOR";
          return `<div class="row"><div class="grow"><b>${esc(m.topic)}</b><div class="sub">${iMentor ? "You mentor " + esc(m.menteeName) : "Mentor: " + esc(m.mentorName)} · ${esc(fmt(m.createdAt, false))}</div></div><span class="chip ${c}">${t}</span>
          ${iMentor && m.status === "REQUESTED" ? `<button class="btn small" data-act="answer" data-id="${Number(m.mentorshipId)}" data-status="ACTIVE">Accept</button><button class="btn danger small" data-act="answer" data-id="${Number(m.mentorshipId)}" data-status="DECLINED">Decline</button>` : ""}
          ${iMentor && m.status === "ACTIVE" ? `<button class="btn ghost small" data-act="answer" data-id="${Number(m.mentorshipId)}" data-status="COMPLETED">Mark complete</button>` : ""}</div>`; }).join("")
          : empty("No mentorships yet. Request one from the available mentors below.")}
      </div>
      <div class="card"><h2>Available mentors</h2><p class="sub" style="margin-top:-6px">Mentors list the skills they teach. Pick a skill and send a request. Skills where you have a gap are marked.</p>
        ${mtr.length ? mtr.map(m => `<div class="row" style="align-items:flex-start"><div class="grow"><b>${esc(m.mentorName)}</b>${m.headline ? `<div class="sub">${esc(m.headline)}</div>` : ""}
          <div style="margin-top:6px">${m.skills.map(k => `<span class="chip ${Number(k.matchesGap) ? "warn" : ""}">${esc(k.skillName)}${Number(k.matchesGap) ? " · your gap" : ""}</span>`).join(" ")}</div></div>
          ${m.openStatus ? `<span class="chip ${m.openStatus === "ACTIVE" ? "ok" : "warn"}">${m.openStatus === "ACTIVE" ? "Mentoring you" : "Request pending"}</span>`
            : !Number(m.accepting) ? `<span class="chip">Not accepting</span>`
            : `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><select style="width:auto;max-width:240px" data-pick="${Number(m.mentorId)}" aria-label="Skill to learn from ${esc(m.mentorName)}">${m.skills.map(k => `<option value="${esc(k.skillName)}">${esc(k.skillName)}</option>`).join("")}</select><button class="btn small" data-act="requestmentor" data-mentor="${Number(m.mentorId)}" data-pick="1">Request mentorship</button></div>`}</div>`).join("")
          : empty("No mentors have listed their skills yet.")}
      </div>
      <div class="card"><h2>Suggested mentors</h2><p class="sub" style="margin-top:-6px">Colleagues who rate themselves 4 or 5 in skills where you have a gap.</p>
        ${sug.length ? sug.map(s => `<div class="row"><div class="grow"><b>${esc(s.mentorName)}</b><div class="sub">${esc(s.skillName)} · level ${Number(s.level)}/5</div></div><button class="btn small" data-act="requestmentor" data-mentor="${Number(s.mentorId)}" data-topic="${esc("Help with " + s.skillName)}">Request mentorship</button></div>`).join("")
          : empty("No suggestions right now. They appear when colleagues rate themselves highly in your gap skills.")}
      </div>
      <div class="card"><h2>Knowledge-sharing sessions</h2>
        ${ses.length ? ses.map(x => { const mine = Number(x.hostId) === Number(S.profile.employeeId); return `<div class="row"><div class="grow"><b>${esc(x.title)}</b> ${mine ? `<span class="chip">You are hosting</span>` : ""}<div class="sub">${esc(fmt(x.scheduledAt))} · Host: ${esc(x.hostName)} · ${Number(x.attendees)} registered</div>${x.skillName || x.durationMin ? `<div class="sub">${x.skillName ? "Covers " + esc(x.skillName) + " · " : ""}${x.durationMin ? Number(x.durationMin) + " min · " : ""}${x.mode === "IN_PERSON" ? "In person" : "Online"}${x.location ? " · " + esc(x.location) : ""}</div>` : ""}${x.description ? `<div class="sub">${esc(x.description)}</div>` : ""}</div>
          ${x.registered ? `<button class="btn ghost small" data-act="unregister" data-id="${Number(x.sessionId)}">Cancel registration</button>` : `<button class="btn small" data-act="register" data-id="${Number(x.sessionId)}">Register</button>`}</div>`; }).join("")
          : empty("No upcoming sessions. Be the first to host one below!")}
      </div>
      <form class="card" data-form="session"><h2>Share your knowledge</h2><p class="sub" style="margin-top:-6px">Host a short session on something you know well.</p>
        <div class="form2"><div><label for="s_title">Session title</label><input id="s_title" name="title" required maxlength="150"></div>
        <div><label for="s_when">Date and time</label><input id="s_when" name="scheduledAt" type="datetime-local" required></div></div>
        <label for="s_desc">What will you cover?</label><textarea id="s_desc" name="description" maxlength="500"></textarea>
        <div style="margin-top:14px"><button class="btn" type="submit">Schedule session</button></div></form>`;
  },

  notifications() {
    const { unread, items } = S.notifs;
    return head("Notifications", unread ? `You have ${unread} unread notification${unread > 1 ? "s" : ""}.` : "You are all caught up.") +
      `<div class="card">${items.length ? `<div style="text-align:right;margin-bottom:6px"><button class="btn ghost small" data-act="readall"${unread ? "" : " disabled"}>Mark all as read</button></div>` +
        items.map(n => `<div class="row ${n.isRead ? "" : "unread"}"><div class="grow">${n.isRead ? esc(n.message) : "<b>" + esc(n.message) + "</b>"}<div class="sub">${esc(fmt(n.createdAt))}</div></div>${n.isRead ? "" : `<button class="btn ghost small" data-act="readone" data-id="${Number(n.notificationId)}">Mark read</button>`}</div>`).join("")
        : empty("No notifications yet.")}</div>`;
  },

  certifications() {
    const certs = S.certs || [];
    const expiring = certs.filter(c => { if (!c.expiryDate) return false; const d = new Date(c.expiryDate); return d > new Date() && d < new Date(Date.now() + 90*86400000); });
    const expired = certs.filter(c => c.expiryDate && new Date(c.expiryDate) < new Date());
    return head("Certifications", "Track your professional certifications and credentials.") +
      (expiring.length ? `<div class="callout"><span><b>⚠ Expiring soon:</b> ${expiring.map(c => esc(c.title)).join(", ")} — renew before they expire.</span></div>` : "") +
      (expired.length ? `<div class="callout" style="background:#fde6e7"><span><b>⛔ Expired:</b> ${expired.map(c => esc(c.title)).join(", ")} — please renew these certifications.</span></div>` : "") +
      `<div class="grid g4" style="margin-bottom:18px">${tile(certs.length, "Total certifications")}${tile(expired.length, "Expired")}${tile(expiring.length, "Expiring soon")}</div>
      <form class="card" data-form="addcert">
        <h2>Add a Certification</h2>
        <div class="form2">
          <div><label for="c_title">Certification title</label><input id="c_title" name="title" required maxlength="200" placeholder="e.g. AWS Certified Cloud Practitioner"></div>
          <div><label for="c_issuer">Issuer</label><input id="c_issuer" name="issuer" maxlength="150" placeholder="e.g. Amazon Web Services"></div>
          <div><label for="c_credid">Credential ID</label><input id="c_credid" name="credentialId" maxlength="100"></div>
          <div><label for="c_url">Credential URL</label><input id="c_url" name="credentialUrl" maxlength="500" placeholder="https://..."></div>
          <div><label for="c_issued">Issue date</label><input id="c_issued" name="issueDate" type="date"></div>
          <div><label for="c_expiry">Expiry date (if applicable)</label><input id="c_expiry" name="expiryDate" type="date"></div>
        </div>
        <div style="margin-top:14px"><button class="btn" type="submit">Add certification</button></div>
      </form>
      <div class="card"><h2>My Certifications</h2>
        ${certs.length ? certs.map(c => {
          const isExpired = c.expiryDate && new Date(c.expiryDate) < new Date();
          const isSoon = c.expiryDate && !isExpired && new Date(c.expiryDate) < new Date(Date.now() + 90*86400000);
          return `<div class="row"><div class="grow"><b>${esc(c.title)}</b>${c.issuer ? ` <span class="sub">by ${esc(c.issuer)}</span>` : ""}
            <div class="sub">${c.issueDate ? "Issued: " + esc(fmt(c.issueDate, false)) : ""}${c.expiryDate ? " · Expires: " + esc(fmt(c.expiryDate, false)) : " · No expiry"}
            ${c.credentialId ? " · ID: " + esc(c.credentialId) : ""}</div>
            ${c.credentialUrl ? `<div class="sub"><a href="${esc(c.credentialUrl)}" target="_blank" rel="noopener">View credential ↗</a></div>` : ""}
          </div>
          ${isExpired ? `<span class="chip bad">Expired</span>` : isSoon ? `<span class="chip warn">Expiring soon</span>` : `<span class="chip ok">Active</span>`}
          <button class="btn danger small" data-act="deletecert" data-id="${Number(c.certificationId)}">Remove</button></div>`;
        }).join("") : empty("No certifications yet. Add your first one above!")}
      </div>`;
  },

  achievements() {
    const data = S.achievements || { stats: {}, achievements: [], improvements: [], milestones: [] };
    const st = data.stats || {};
    const badges = data.achievements || [];
    const impr = data.improvements || [];
    const milestones = data.milestones || [];
    const BADGE_ICONS = { MILESTONE: "🏁", COURSE_COMPLETE: "🎓", SKILL_MASTERY: "⭐", ASSESSMENT_ACE: "🏆", STREAK: "🔥" };
    return head("Progress & Achievements", "Track your learning journey, measure improvement, and earn badges.") +
      `<div class="grid g4" style="margin-bottom:18px">
        ${tile(st.completedCourses || 0, "Courses completed")}${tile(st.assessedSkills || 0, "Skills assessed")}
        ${tile(st.totalCertifications || 0, "Certifications")}${tile(badges.length, "Achievements earned")}
      </div>
      <div class="grid g2">
        <div class="card"><h2>🏆 Achievements & Badges</h2>
          ${badges.length ? badges.map(a => `<div class="row"><div class="grow">
            <b>${BADGE_ICONS[a.badgeType] || "🏅"} ${esc(a.title)}</b>
            <div class="sub">${esc(a.description || "")} · Earned ${esc(fmt(a.earnedAt))}</div>
          </div><span class="chip">${esc(a.badgeType.replace("_", " "))}</span></div>`).join("") : empty("Complete assessments and courses to earn your first badge!")}
        </div>
        <div class="card"><h2>📈 Skill Improvement</h2>
          <p class="sub" style="margin-top:-6px">Comparing your first and latest assessment scores.</p>
          ${impr.length ? impr.map(i => {
            const improved = Number(i.improvement) > 0;
            return `<div class="row"><div class="grow"><b>${esc(i.skillName)}</b>
              <div class="sub">First: ${Number(i.firstScore)}% → Latest: ${Number(i.latestScore)}%</div></div>
              <span class="chip ${improved ? "ok" : Number(i.improvement) === 0 ? "warn" : "bad"}">${improved ? "+" : ""}${Number(i.improvement).toFixed(1)}%</span></div>`;
          }).join("") : empty("Retake a skill assessment to see your improvement over time.", goBtn("assessment", "Go to assessments"))}
        </div>
      </div>
      <div class="card" style="margin-top:18px"><h2>📅 Learning Milestones</h2>
        ${milestones.length ? `<div class="tablewrap"><table><thead><tr><th>Course</th><th>Skill</th><th>Hours</th><th>Completed</th></tr></thead><tbody>
          ${milestones.map(m => `<tr><td><b>${esc(m.courseTitle)}</b></td><td>${esc(m.skillName)}</td><td>${Number(m.durationHours)}h</td><td>${esc(fmt(m.completedAt))}</td></tr>`).join("")}
        </tbody></table></div>` : empty("Complete a course to see your learning milestones here.", goBtn("recommended", "Browse training"))}
      </div>
      <div class="card" style="margin-top:18px"><h2>🎯 Learning Goals Progress</h2>
        <div class="row"><div class="grow"><b>Skills assessed</b><div class="sub">${st.assessedSkills || 0} of ${st.totalSkills || 0} skills</div>
          ${progressBar(pct(st.assessedSkills || 0, st.totalSkills || 1))}</div></div>
        <div class="row"><div class="grow"><b>Courses completed</b><div class="sub">${st.completedCourses || 0} of ${st.totalEnrolled || 0} enrolled</div>
          ${progressBar(pct(st.completedCourses || 0, st.totalEnrolled || 1), (st.completedCourses || 0) === (st.totalEnrolled || 0) && (st.totalEnrolled || 0) > 0 ? "ok" : "")}</div></div>
      </div>`;
  },

  reports() {
    const p = S.profile, g = S.gaps.summary, l = S.learning.summary;
    return head("My Reports", "A summary of your skills and learning. Download it or print it as a PDF.") +
      `<div class="card noprint" style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-act="csv">Download CSV</button><button class="btn ghost" data-act="print">Print / Save as PDF</button></div>
      <div class="card"><h2>${esc(fullName(p))}</h2><div class="sub">${esc(p.email)} · Report date ${esc(fmt(new Date().toISOString(), false))}</div></div>
      <div class="grid g4" style="margin-bottom:18px">${tile(g.assessed, "Skills assessed")}${tile(g.gapCount, "Open gaps")}${tile(l.completed + " / " + l.enrolled, "Courses completed")}${tile(l.hoursCompleted, "Learning hours")}</div>
      <div class="card"><h2>Skills &amp; gaps</h2>${S.skills.length ? `<div class="tablewrap"><table><thead><tr><th>Skill</th><th>Category</th><th>My level</th><th>Target</th><th>Gap</th></tr></thead><tbody>${S.skills.map(s => `<tr><td>${esc(s.skillName)}</td><td>${esc(s.category)}</td><td>${s.selfLevel}</td><td>${s.requiredLevel}</td><td>${Math.max(s.requiredLevel - s.selfLevel, 0)}</td></tr>`).join("")}</tbody></table></div>` : empty("No skills rated yet.")}</div>
      <div class="card"><h2>Learning</h2>${S.learning.items.length ? `<div class="tablewrap"><table><thead><tr><th>Course</th><th>Skill</th><th>Hours</th><th>Progress</th><th>Status</th></tr></thead><tbody>${S.learning.items.map(i => `<tr><td>${esc(i.title)}</td><td>${esc(i.skillName)}</td><td>${Number(i.durationHours)}</td><td>${Number(i.progressPct)}%</td><td>${esc(i.status === "COMPLETED" ? "Completed" : "In progress")}</td></tr>`).join("")}</tbody></table></div>` : empty("No courses yet.")}</div>`;
  }
};

/* ===== Ask-AI chat on the Knowledge Gaps page ===== */
S.chat = []; S.chatBusy = false;
function mdLite(src) {
  const inl = t => esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/`([^`]+)`/g, "<code>$1</code>").replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>");
  return String(src ?? "").split("```").map((seg, i) => {
    if (i % 2) return `<pre><code>${esc(seg.replace(/^[\w+#-]*\n/, "").replace(/\n$/, ""))}</code></pre>`;
    const out = []; let list = null;
    const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
    seg.split("\n").forEach(line => {
      let m;
      if ((m = line.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inl(m[1])}</li>`); }
      else if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inl(m[1])}</li>`); }
      else { close(); if (line.trim()) out.push(`<p>${inl(line)}</p>`); }
    });
    close(); return out.join("");
  }).join("");
}
function chatLogHtml() {
  const hello = `<div class="msg bot"><p>Hi ${esc(S.profile.firstName || "there")}. Ask me anything about the skills where you have a gap, for example why you missed a question or how to start learning a topic.</p></div>`;
  return hello + S.chat.map(m => m.role === "user" ? `<div class="msg user">${esc(m.content)}</div>`
    : `<div class="msg bot${m.error ? " err" : ""}">${mdLite(m.content)}${m.source ? `<div class="src">${m.source === "AI" ? "AI assistant" : "Built-in helper"}${m.note ? " · " + esc(m.note) : ""}</div>` : ""}</div>`).join("")
    + (S.chatBusy ? `<div class="msg bot typing" aria-label="The assistant is typing"><i></i><i></i><i></i></div>` : "");
}
function chatHtml() {
  const first = ((S.gaps && S.gaps.gaps) || [])[0];
  const ideas = [first ? `Why am I weak in ${first.skillName}?` : "How do I start improving my skills?",
    first ? `Give me a 2-week plan for ${first.skillName}` : "What should I learn first?",
    "Explain the questions I got wrong", "Which course should I take first?"];
  return `<div class="card chat"><div class="chat-head"><div><h2>Ask AI about your gaps</h2><p class="sub">Ask a doubt about any skill you are weak in. Answers use your assessment results.</p></div>
    <button class="btn ghost small noprint" data-act="chatclear">Clear chat</button></div>
    <div class="chat-log" id="chatLog" role="log" aria-live="polite">${chatLogHtml()}</div>
    <div class="chat-suggest noprint">${ideas.map(t => `<button type="button" class="chipbtn" data-act="chatask" data-q="${esc(t)}">${esc(t)}</button>`).join("")}</div>
    <form class="chat-form noprint" data-form="chat"><textarea name="message" rows="1" maxlength="1500" required aria-label="Your question" placeholder="Type your doubt, for example: what is the difference between INNER JOIN and LEFT JOIN?"></textarea><button class="btn" type="submit">Send</button></form></div>`;
}
function chatPaint() {
  const log = $("#chatLog"); if (log) { log.innerHTML = chatLogHtml(); log.scrollTop = log.scrollHeight; }
  const b = $(".chat-form button"); if (b) b.disabled = S.chatBusy;
}
async function sendChat(text) {
  if (!text || S.chatBusy) return;
  S.chat.push({ role: "user", content: text }); S.chatBusy = true; chatPaint();
  try {
    const history = S.chat.slice(0, -1).slice(-8).map(m => ({ role: m.role, content: m.content }));
    const r = await api("/me/chat", { method: "POST", body: { message: text, history } });
    S.chat.push({ role: "assistant", content: r.reply, source: r.source, note: r.note });
  } catch (e) { S.chat.push({ role: "assistant", content: "I could not answer that: " + e.message, error: true }); }
  S.chatBusy = false; chatPaint();
}
const _gapsView = views.gaps; views.gaps = () => _gapsView() + chatHtml();

/* ============================ RENDER ============================ */
function renderNav() {
  $("#nav").innerHTML = NAV_SECTIONS.map(sec =>
    `<div class="nav-section-label">${esc(sec.title)}</div>` +
    sec.items.map(([id, label, iconSvg]) =>
      `<button data-act="go" data-view="${id}"${id === current ? ' aria-current="page"' : ""}>${iconSvg} <span>${esc(label)}</span>${id === "notifications" && S.notifs && S.notifs.unread ? `<span class="count">${S.notifs.unread}</span>` : ""}</button>`
    ).join("")
  ).join("");
}
function renderHeader() {
  // guard.js writes the login name (e.g. "Ramya -") into these; keep the cleaner profile name on top
  const setText = (sel, v) => { const el = $(sel); if (el && el.textContent !== v) el.textContent = v; };
  if (S.profile) { setText("#userName", fullName(S.profile)); setText("#userEmail", S.profile.email); }
  const b = $("#badge"), n = S.notifs ? S.notifs.unread : 0; b.hidden = !n; b.textContent = n;
}
function render() {
  renderNav(); renderHeader();
  $("#main").innerHTML = views[current]();
  document.title = (VIEWS.find(v => v[0] === current) || [0, "Dashboard"])[1] + " | Workforce Intelligence";
  if (current === "recommended" && !S.ai && !S.aiLoading && !S.aiError) ensureAi(false);
}
function go(view) {
  if (!views[view]) view = "overview";
  current = view; if (location.hash !== "#" + view) location.hash = view;
  render(); window.scrollTo({ top: 0 }); $("#main").focus({ preventScroll: true });
}

/* ============================ ACTIONS =========================== */
async function run(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); }
  catch (e) { toast(e.message, true); }
  render();
}
const post = (p, body) => api(p, { method: "POST", body });
const put = (p, body) => api(p, { method: "PUT", body });

const actions = {
  go: d => go(d.view),
  startassessment: d => run(async () => { S.assessmentSkillId = +d.skill; S.assessmentQuestions = await api("/me/assessment/questions?skillId=" + +d.skill); S.lastAssessment = null; go("assessment"); }, "Assessment loaded"),
  removeskill: d => { if (confirm("Remove this skill from your profile?")) run(async () => { await api("/me/skills/" + +d.skill, { method: "DELETE" }); await refresh("skills", "gaps", "recs", "suggestions"); }, "Skill removed"); },
  deletecert: d => { if (confirm("Remove this certification?")) run(async () => { await api("/me/certifications/" + +d.id, { method: "DELETE" }); await refresh("certs"); }, "Certification removed"); },
  enroll: d => run(async () => { await post("/me/enroll", { courseId: +d.course }); await refresh("recs", "learning", "notifs"); }, "Enrolled! Track it under Learning Progress."),
  enrollpath: d => run(async () => { await post("/me/enroll-path", { pathId: +d.path }); await refresh("recs", "learning", "notifs"); }, "Path started"),
  saveprogress: d => run(async () => { const v = $('[data-range="' + d.course + '"]').value; await put("/me/progress", { courseId: +d.course, progressPct: +v }); await refresh("learning"); }, "Progress saved"),
  complete: d => run(async () => { await put("/me/progress", { courseId: +d.course, progressPct: 100 }); await refresh("learning", "notifs"); }, "Course completed. Well done!"),
  requestmentor: d => run(async () => {
    let topic = d.topic;
    if (d.pick) { const sel = $('select[data-pick="' + +d.mentor + '"]'); topic = "Help with " + (sel ? sel.value : "my skills"); }
    await post("/me/mentorship-requests", { mentorId: +d.mentor, topic }); await refresh("mentorships", "suggestions", "mentors");
  }, "Mentorship request sent"),
  answer: d => run(async () => { await put("/me/mentorships/" + +d.id, { status: d.status }); await refresh("mentorships"); }, "Updated"),
  register: d => run(async () => { await post("/sessions/" + +d.id + "/register"); await refresh("sessions"); }, "You are registered"),
  unregister: d => run(async () => { await api("/sessions/" + +d.id + "/register", { method: "DELETE" }); await refresh("sessions"); }, "Registration cancelled"),
  readone: d => run(async () => { await put("/me/notifications/" + +d.id + "/read"); await refresh("notifs"); }),
  readall: () => run(async () => { await put("/me/notifications/read-all"); await refresh("notifs"); }, "All marked as read"),
  airefresh: () => ensureAi(true),
  chatask: d => sendChat(d.q),
  chatclear: () => { S.chat = []; chatPaint(); },
  csv: () => downloadCsv(),
  print: () => window.print()
};
const forms = {
  profile: f => run(async () => { S.profile = await put("/me/profile", Object.fromEntries(new FormData(f))); }, "Profile saved"),
  addskill: f => run(async () => { const d = Object.fromEntries(new FormData(f)); await put("/me/skills", { skillId: +d.skillId }); await refresh("skills", "gaps", "recs", "suggestions", "assessmentHistory"); }, "Skill added. Take its assessment to get recommendations."),
  startassessment: f => run(async () => { const d = Object.fromEntries(new FormData(f)); S.assessmentSkillId = +d.skillId; S.assessmentQuestions = await api("/me/assessment/questions?skillId=" + +d.skillId); S.lastAssessment = null; current = "assessment"; if (location.hash !== "#assessment") location.hash = "assessment"; }, "Assessment loaded"),
  assessment: f => run(async () => { const answers = S.assessmentQuestions.map(q => { const chosen = f.querySelector('input[name="q_' + q.questionId + '"]:checked'); return { questionId: q.questionId, selectedOption: chosen ? chosen.value : "" }; }); if (answers.some(a => !a.selectedOption)) throw new Error("Please answer every question."); S.lastAssessment = await post("/me/assessment/submit", { skillId: +S.assessmentSkillId, answers }); S.assessmentQuestions = []; await refresh("skills", "gaps", "recs", "notifs", "assessmentHistory", "achievements"); }, "Assessment submitted. Your recommendations are updated."),
  chat: f => { const ta = f.elements.message; const t = ta.value.trim(); if (!t) return; ta.value = ""; sendChat(t); },
  roleselect: f => run(async () => {
