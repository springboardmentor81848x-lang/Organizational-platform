<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HR Specialist Dashboard | Workforce Intelligence</title>
<meta name="description" content="Strategic HR dashboard for workforce skill planning, competency frameworks, knowledge gap analysis, learning coordination, and workforce analytics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=premium">
<style>
  /* ===== DESIGN SYSTEM ===== */
  :root {
    --brand: #0B6E75; --brand-dark: #095A60; --brand-light: #E3F1F2;
    --nav: #101C2B; --ink: #1A2433; --muted: #5B6778;
    --bg: #F3F5F8; --card: #ffffff; --line: #DDE2E9;
    --ok: #1F7A4D; --ok-bg: #E5F3EB;
    --warn: #8A5A00; --warn-bg: #FFF1D6;
    --bad: #B3261E; --bad-bg: #FBE7E5;
    --info-bg: #E3F1F2;
    --accent1: #0B6E75; --accent2: #2F6FA3; --accent3: #D9822B;
    --accent4: #1F7A4D; --accent5: #B3261E; --accent6: #5B6778;
    --shadow-xs: 0 1px 2px rgba(16,28,43,.04);
    --shadow-sm: 0 2px 6px rgba(16,28,43,.06);
    --shadow-md: 0 6px 16px rgba(16,28,43,.08);
    --shadow-lg: 0 12px 28px rgba(16,28,43,.10);
    --shadow-xl: 0 20px 40px rgba(16,28,43,.14);
    --transition-fast: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    --transition-normal: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: 'IBM Plex Sans', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #5FB3B8; outline-offset: 2px; }

  /* ===== HEADER ===== */
  .brand { display: flex; align-items: center; gap: 12px; font-size: 16px; line-height: 1.2; font-weight: 500; }
  .logo {
    background: linear-gradient(135deg, var(--brand), #0d848d);
    border-radius: 8px; padding: 8px 12px; font-size: 15px; font-weight: 700; letter-spacing: .5px;
    box-shadow: 0 2px 8px rgba(11,110,117,.35);
  }
  .top .right { display: flex; align-items: center; gap: 16px; }
  .who { text-align: right; line-height: 1.2; }
  .who strong { font-size: 13.5px; }
  .who small { display: block; opacity: .78; font-size: 11.5px; }
  .role-badge {
    background: rgba(255,255,255,.14); border-radius: 20px;
    font-size: 11px; font-weight: 700; letter-spacing: .4px; text-transform: uppercase;
    padding: 4px 12px; white-space: nowrap; border: 1px solid rgba(255,255,255,.12);
  }

  /* ===== BUTTONS ===== */
  .btn {
    background: var(--brand); color: #fff; border: 0; border-radius: 8px;
    padding: 8px 16px; cursor: pointer; font-weight: 600; font-size: 13.5px;
    transition: all var(--transition-fast);
    box-shadow: 0 1px 3px rgba(11,110,117,.2);
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    text-decoration: none;
  }
  .btn:hover {
    background: var(--brand-dark);
    box-shadow: 0 4px 12px rgba(11,110,117,.28);
    transform: translateY(-1px);
  }
  .btn:active { transform: translateY(0); box-shadow: 0 1px 2px rgba(11,110,117,.2); }
  .btn:disabled { opacity: .55; cursor: default; transform: none; box-shadow: none; }
  .btn.ghost {
    background: #fff; color: var(--brand); border: 1px solid var(--line);
    box-shadow: var(--shadow-xs);
  }
  .btn.ghost:hover {
    background: var(--brand-light); border-color: var(--brand);
    color: var(--brand-dark); box-shadow: var(--shadow-sm);
  }
  .btn.danger {
    background: #fff; color: var(--bad); border: 1px solid #E5B3AF;
    box-shadow: var(--shadow-xs);
  }
  .btn.danger:hover {
    background: var(--bad-bg); border-color: var(--bad);
    box-shadow: var(--shadow-sm);
  }
  .btn.small { padding: 5px 12px; font-size: 12.5px; border-radius: 6px; }

  /* ===== MAIN CONTENT ===== */
  main { min-width: 0; }
  h1 { font-size: 26px; font-weight: 600; letter-spacing: -.01em; margin: 0 0 4px; }
  h2 { font-size: 18px; font-weight: 600; margin: 0 0 12px; }
  p.lead { font-size: 14px; max-width: 72ch; margin: 0 0 20px; color: var(--muted); }
  .section-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
  .section-head h1 { margin: 0 0 4px; }
  .section-head p { margin: 0; font-size: 14px; color: var(--muted); max-width: 72ch; }

  /* ===== CARDS & TILES ===== */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 22px; box-shadow: var(--shadow-sm); margin-bottom: 20px;
    transition: transform var(--transition-normal), box-shadow var(--transition-normal), border-color var(--transition-normal);
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #CAD5E2; }
  .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 12px; flex-wrap: wrap; }
  .card-header h2 { margin: 0; }
  .grid { display: grid; gap: 16px; }
  .g4 { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); }
  .g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }

  .tile, .stat-tile {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px 20px; box-shadow: var(--shadow-sm); transition: all var(--transition-fast);
    position: relative; overflow: hidden;
  }
  .tile:hover, .stat-tile:hover {
    transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: #CAD5E2;
  }
  .stat-tile.accent-purple { box-shadow: inset 0 3px 0 var(--accent1), var(--shadow-sm); }
  .stat-tile.accent-purple:hover { box-shadow: inset 0 3px 0 var(--accent1), var(--shadow-md); }
  .stat-tile.accent-blue   { box-shadow: inset 0 3px 0 var(--accent2), var(--shadow-sm); }
  .stat-tile.accent-blue:hover   { box-shadow: inset 0 3px 0 var(--accent2), var(--shadow-md); }
  .stat-tile.accent-amber  { box-shadow: inset 0 3px 0 var(--accent3), var(--shadow-sm); }
  .stat-tile.accent-amber:hover  { box-shadow: inset 0 3px 0 var(--accent3), var(--shadow-md); }
  .stat-tile.accent-green  { box-shadow: inset 0 3px 0 var(--accent4), var(--shadow-sm); }
  .stat-tile.accent-green:hover  { box-shadow: inset 0 3px 0 var(--accent4), var(--shadow-md); }
  .stat-tile.accent-red    { box-shadow: inset 0 3px 0 var(--accent5), var(--shadow-sm); }
  .stat-tile.accent-red:hover    { box-shadow: inset 0 3px 0 var(--accent5), var(--shadow-md); }

  .tile b, .stat-tile b {
    display: block; font-size: 28px; line-height: 1.15; font-weight: 700;
    font-variant-numeric: tabular-nums; letter-spacing: -.01em; color: var(--ink); margin-bottom: 4px;
  }
  .tile span, .stat-tile span { color: var(--muted); font-size: 13px; font-weight: 500; }

  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); flex-wrap: wrap; }
  .row:first-of-type { border-top: 0; }
  .row .grow { flex: 1; min-width: 200px; }
  .sub { color: var(--muted); font-size: 13px; }
  .chip { display: inline-block; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; background: var(--info-bg); color: var(--brand-dark); }
  .chip.ok { background: var(--ok-bg); color: var(--ok); }
  .chip.warn { background: var(--warn-bg); color: var(--warn); }
  .chip.bad { background: var(--bad-bg); color: var(--bad); }
  /* .empty styles inherited from style.css */
  .callout {
    background: var(--info-bg); border: 1px solid #BFDDE0; border-radius: 10px;
    padding: 14px 18px; margin-bottom: 18px; display: flex; gap: 12px;
    align-items: center; justify-content: space-between; flex-wrap: wrap;
    box-shadow: var(--shadow-xs);
  }

  /* ===== FORMS ===== */
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input, select, textarea {
    width: 100%; padding: 9px 12px; border: 1px solid var(--line);
    border-radius: 8px; background: #fff; font-size: 13.5px;
    transition: all var(--transition-fast);
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(11,110,117,.16); }
  textarea { min-height: 80px; resize: vertical; }
  .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .filter-bar select, .filter-bar input { width: auto; }
  .search-box { position: relative; }
  .search-box input { padding-left: 34px; min-width: 220px; }
  .search-box svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 14px; height: 14px; }

  /* ===== BARS & AVATAR ===== */
  .bar { height: 8px; background: #E6EAF0; border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 999px; transition: width .3s cubic-bezier(0.4,0,0.2,1); }
  .gapbar { position: relative; height: 10px; background: #E6EAF0; border-radius: 999px; }
  .gapbar > i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--brand); border-radius: 999px; }
  .gapbar > u { position: absolute; top: -3px; bottom: -3px; width: 3px; background: #D9822B; text-decoration: none; border-radius: 2px; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12.5px; color: #fff; flex-shrink: 0; box-shadow: var(--shadow-xs); }

  /* ===== TABLE ===== */
  .tablewrap { overflow-x: auto; border-radius: 8px; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13.5px; }
  th {
    color: var(--muted); font-weight: 600; font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .5px; background: #F8FAFC; padding: 12px 14px;
    border-bottom: 1px solid var(--line); border-top: 1px solid var(--line);
    font-variant-numeric: tabular-nums;
  }
  th:first-child { border-top-left-radius: 8px; border-left: 1px solid var(--line); }
  th:last-child { border-top-right-radius: 8px; border-right: 1px solid var(--line); }
  td {
    text-align: left; padding: 13px 14px; border-bottom: 1px solid #EDF1F5;
    vertical-align: middle; font-variant-numeric: tabular-nums;
    transition: background var(--transition-fast);
  }
  td:first-child { border-left: 1px solid #EDF1F5; }
  td:last-child { border-right: 1px solid #EDF1F5; }
  tr:last-child td { border-bottom: 1px solid var(--line); }
  tr:last-child td:first-child { border-bottom-left-radius: 8px; }
  tr:last-child td:last-child { border-bottom-right-radius: 8px; }
  tr:hover td { background: #F8FAFD; }

  /* ===== MODAL ===== */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(16,28,43,.5);
    backdrop-filter: blur(4px); display: flex; align-items: center;
    justify-content: center; z-index: 100; padding: 16px;
  }
  .modal {
    background: #fff; border-radius: 14px; padding: 26px; max-width: 620px;
    width: 100%; max-height: 90vh; overflow-y: auto; border: 1px solid var(--line);
    box-shadow: var(--shadow-xl); animation: fadeIn .2s cubic-bezier(0.16, 1, 0.3, 1);
  }
  @keyframes fadeIn { from { transform: translateY(14px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .modal-header h2 { margin: 0; font-size: 19px; font-weight: 600; }
  .modal-close {
    background: none; border: 0; font-size: 22px; cursor: pointer;
    color: var(--muted); padding: 4px 8px; border-radius: 6px;
    transition: all var(--transition-fast);
  }
  .modal-close:hover { background: #F3F5F8; color: var(--ink); }

  /* ===== TOAST ===== */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: #1A2433; color: #fff; padding: 11px 20px; border-radius: 8px;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 90vw;
    z-index: 200; font-size: 13.5px; font-weight: 500; box-shadow: var(--shadow-lg);
  }
  #toast.show { opacity: 1; }
  #toast.err { background: var(--bad); }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 992px) {
    .who small { display: none; }
  }
  @media (max-width: 520px) {
    .brand span:last-child { display: none; }
    .top .right { gap: 8px; min-width: 0; }
    .who { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .role-badge { display: none; }
  }
  @media print {
    .top, nav#nav, .noprint, #toast, .modal-overlay { display: none !important; }
    .layout { display: block; padding: 0; }
    .card, .tile, .stat-tile { box-shadow: none; border: 1px solid #ccc; }
    body { background: #fff; }
  }
</style>
</head>
<body data-role="HR_MANAGER">
<div id="app" hidden>
  <!-- HEADER (SAME STRUCTURE AS EMPLOYEE DASHBOARD) -->
  <header class="top">
    <div class="brand">
      <button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle navigation drawer" aria-expanded="false">

      </button>

      </button>
      <span class="role-badge">&#128203; HR Specialist</span>
      <div class="user-menu-wrap">
        <button class="user-profile-btn" id="userMenuBtn" aria-expanded="false" aria-haspopup="true" title="User account menu">

            <strong id="userName">Loading…</strong>

          </div>
          <svg class="chevron-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>

              <span>Sign Out</span>
            </button>
          </div>
        </div>
      </div>
      <button class="btn outline-nav" id="logoutBtn">Logout</button>
    </div>
  </header>

  <!-- LAYOUT -->
  <div class="layout">
    <!-- SIDEBAR -->
    <nav id="nav" aria-label="Dashboard sections">
      <div class="nav-section-label">Workforce Analytics</div>
      <button data-act="go" data-view="overview" aria-current="page">

        <span>Dashboard</span>
      </button>
      <button data-act="go" data-view="directory">

        <span>Reports & Analytics</span>
      </button>
      <button data-act="go" data-view="notifications">
        <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span>Announcements</span>
      </button>
    </nav>

    <!-- MAIN CONTENT -->
    <main id="main" tabindex="-1">
      <div class="card empty">Loading HR Intelligence Dashboard…</div>
    </main>
  </div>
</div>

<!-- MODAL CONTAINER -->
<div id="modalOverlay" class="modal-overlay" hidden>
  <div class="modal" id="modalBox">
    <div class="modal-header">
      <h2 id="modalTitle">Modal</h2>
      <button class="modal-close" id="modalCloseBtn">&times;</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>

<!-- TOAST -->
<div id="toast" role="status" aria-live="polite"></div>

<script src="js/guard.js"></script>
<script>
(function() {
  const API = "http://localhost:8080/api/hr";
  let currentView = "overview";
  let S = {
    overview: null,
    employees: [],
    skills: [],
    categories: [],
    roles: [],
    gaps: null,
    courses: [],
    paths: [],
    trainings: [],
    mentors: [],
    mentorMatches: [],
    progress: null,
    feedback: null,
    reports: null,
    notifications: [],
    meta: { departments: [], designations: [], roles: [], skills: [] }
  };

  const COLORS = ["#0B6E75", "#2F6FA3", "#D9822B", "#1F7A4D", "#8E44AD", "#C0392B", "#16A085"];

  function getSession() {
    try { return JSON.parse(localStorage.getItem("wki_session") || "null"); } catch { return null; }
  }

  async function hrApi(endpoint, opts = {}) {
    const s = getSession();
    const headers = { "Content-Type": "application/json" };
    if (s && s.token) headers["Authorization"] = "Bearer " + s.token;
    const res = await fetch(API + endpoint, {
      method: opts.method || "GET",
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const err = new Error(data.message || "Request failed");
      err.status = res.status;
      throw err;
    }
    return data;
  }

  function toast(msg, isErr = false) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg;
    t.className = isErr ? "show err" : "show";
    setTimeout(() => { t.className = ""; }, 3200);
  }

  function esc(s) {
    return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function av(name, size = 32) {
    let h = 0;
    for (let c of String(name || "X")) h = (h * 31 + c.charCodeAt(0)) & 0xffffffff;
    const bg = COLORS[Math.abs(h) % COLORS.length];
    const ini = String(name || "?").trim().split(/\s+/).slice(0, 2).map(p => p[0]?.toUpperCase() || "").join("");
    return `<span class="avatar" style="background:${bg};width:${size}px;height:${size}px">${ini}</span>`;
  }

  function openModal(title, html) {
    document.getElementById("modalTitle").textContent = title;
    document.getElementById("modalBody").innerHTML = html;
    document.getElementById("modalOverlay").hidden = false;
  }

  function closeModal() {
    document.getElementById("modalOverlay").hidden = true;
  }

  document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
  document.getElementById("modalOverlay").addEventListener("click", (e) => {
    if (e.target.id === "modalOverlay") closeModal();
  });

  // =========================================================================
  // NATIVE CANVAS CHARTS (Matching Calm Enterprise Palette)
  // =========================================================================
  function drawDonut(id, segments) {
    const c = document.getElementById(id);
    if (!c) return;
    const ctx = c.getContext("2d"), cx = c.width / 2, cy = c.height / 2, r = Math.min(cx, cy) - 10;
    ctx.clearRect(0, 0, c.width, c.height);
    const total = segments.reduce((a, s) => a + s.value, 0);
    if (!total) return;
    let start = -Math.PI / 2;
    segments.forEach(seg => {
      const angle = (seg.value / total) * 2 * Math.PI;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, start, start + angle); ctx.closePath();
      ctx.fillStyle = seg.color; ctx.fill();
      start += angle;
    });
    ctx.beginPath(); ctx.arc(cx, cy, r * 0.58, 0, 2 * Math.PI); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.fillStyle = "#1A2433"; ctx.font = "bold 20px 'IBM Plex Sans',sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(total, cx, cy - 8);
    ctx.font = "11px 'IBM Plex Sans',sans-serif"; ctx.fillStyle = "#5B6778"; ctx.fillText("employees", cx, cy + 10);
  }

  function drawBar(id, labels, values, colors) {
    const c = document.getElementById(id);
    if (!c) return;
    const ctx = c.getContext("2d"), W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    const pad = { top: 20, right: 16, bottom: 44, left: 36 };
    const cW = W - pad.left - pad.right, cH = H - pad.top - pad.bottom;
    const maxV = Math.max(...values, 1);
    const bW = Math.floor(cW / labels.length * 0.55), gap = Math.floor(cW / labels.length * 0.45);

    ctx.strokeStyle = "#DDE2E9"; ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = pad.top + cH - (i / 4) * cH;
      ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(pad.left + cW, y); ctx.stroke();
      ctx.fillStyle = "#5B6778"; ctx.font = "11px 'IBM Plex Sans',sans-serif"; ctx.textAlign = "right";
      ctx.fillText(Math.round(maxV * i / 4), pad.left - 4, y + 4);
    }
    labels.forEach((lbl, i) => {
      const x = pad.left + i * (bW + gap) + gap / 2;
      const bh = (values[i] / maxV) * cH, y = pad.top + cH - bh;
      ctx.beginPath(); ctx.rect(x, y, bW, bh); ctx.fillStyle = colors[i % colors.length]; ctx.fill();
      ctx.fillStyle = "#1A2433"; ctx.textAlign = "center"; ctx.font = "bold 11px 'IBM Plex Sans',sans-serif";
      ctx.fillText(values[i], x + bW / 2, y - 5);
      ctx.fillStyle = "#5B6778"; ctx.font = "10px 'IBM Plex Sans',sans-serif";
      const words = lbl.split(" ");
      words.slice(0, 2).forEach((w, wi) => ctx.fillText(w, x + bW / 2, pad.top + cH + 14 + wi * 12));
    });
  }

  function drawRadar(id, labels, values, max = 5) {
    const c = document.getElementById(id);
    if (!c) return;
    const ctx = c.getContext("2d"), W = c.width, H = c.height;
    ctx.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2, r = Math.min(cx, cy) - 38, n = labels.length, a0 = -Math.PI / 2;
    function pt(i, val) { const a = a0 + (i / n) * 2 * Math.PI, d = (val / max) * r; return [cx + d * Math.cos(a), cy + d * Math.sin(a)]; }

    [0.25, 0.5, 0.75, 1].forEach(f => {
      ctx.beginPath();
      for (let i = 0; i < n; i++) { const [x, y] = pt(i, max * f); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); }
      ctx.closePath(); ctx.strokeStyle = "#DDE2E9"; ctx.lineWidth = 1; ctx.stroke();
    });
    for (let i = 0; i < n; i++) {
      const [x, y] = pt(i, max);
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(x, y); ctx.strokeStyle = "#DDE2E9"; ctx.lineWidth = 1; ctx.stroke();
    }
    // Data polygon
    ctx.beginPath();
    values.forEach((v, i) => { const [x, y] = pt(i, v); i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
    ctx.closePath(); ctx.fillStyle = "rgba(11,110,117,.22)"; ctx.fill(); ctx.strokeStyle = "#0B6E75"; ctx.lineWidth = 2; ctx.stroke();
    values.forEach((v, i) => { const [x, y] = pt(i, v); ctx.beginPath(); ctx.arc(x, y, 4, 0, 2 * Math.PI); ctx.fillStyle = "#0B6E75"; ctx.fill(); });
    labels.forEach((lbl, i) => {
      const [x, y] = pt(i, max + 0.85);
      ctx.fillStyle = "#1A2433"; ctx.font = "10px 'IBM Plex Sans',sans-serif"; ctx.textAlign = "center";
      const ws = lbl.split(" ");
      ws.slice(0, 2).forEach((w, wi) => ctx.fillText(w, x, y + wi * 11));
    });
  }

  // =========================================================================
  // VIEW RENDERERS (A to M)
  // =========================================================================
  const views = {
    // A. Dashboard Overview
    overview: function() {
      const ov = S.overview;
      if (!ov) return '<div class="empty">Loading overview metrics…</div>';
      const topGapSlice = (ov.topGaps || []).slice(0, 5);

      const sessUser = getSession();
      const hrName = (sessUser && sessUser.fullName) ? sessUser.fullName : "HR Specialist";
      return `
        <div class="section-head">
          <div>
            <h1>Welcome back to the HR Dashboard, ${esc(hrName)}!</h1>
            <p class="lead">Organisation-wide view of workforce competencies, critical knowledge gaps, and training participation.</p>
          </div>
          <button class="btn ghost small" data-act="exportCSV">Export Summary CSV</button>
        </div>

        <div class="grid g4" style="margin-bottom:18px">
          <div class="stat-tile accent-purple">
            <span class="tile-icon">👥</span>
            <b>${ov.totalEmployees}</b>
            <span>Total Employees</span>
          </div>
          <div class="stat-tile accent-blue">
            <span class="tile-icon">🎯</span>
            <b>${ov.skillCoveragePct}%</b>
            <span>Skill Coverage (${ov.assessedSkills}/${ov.totalSkills})</span>
          </div>
          <div class="stat-tile accent-red">
            <span class="tile-icon">⚠️</span>
            <b>${ov.criticalGaps}</b>
            <span>Critical Skill Gaps</span>
          </div>
          <div class="stat-tile accent-amber">
            <span class="tile-icon">💡</span>
            <b>${ov.activeLearners}</b>
            <span>Active Learners</span>
          </div>
          <div class="stat-tile accent-green">
            <span class="tile-icon">🎓</span>
            <b>${ov.trainingCompletionRate}%</b>
            <span>Training Completion</span>
          </div>
        </div>

        <div class="grid g2">
          <div class="card">
            <div class="card-header">
              <h2>Top Skill Shortages</h2>
              <button class="btn ghost small" data-act="go" data-view="gaps">Full Analysis &rarr;</button>
            </div>
            ${topGapSlice.length ? topGapSlice.map(g => `
              <div style="padding:10px 0;border-top:1px solid var(--line)">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
                  <strong>${esc(g.skill)}</strong>
                  <span class="chip bad">${g.employeesAffected} affected</span>
                </div>
                <div class="gapbar" style="margin:6px 0">
                  <i style="width:${(g.avgProficiency/5)*100}%"></i>
                  <u style="left:calc(${(g.avgRequired/5)*100}% - 1px)"></u>
                </div>
                <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--muted)">
                  <span>Org Avg: ${g.avgProficiency}/5 (Target: ${g.avgRequired}/5)</span>
                  <span>Avg Gap: ${g.avgGap}</span>
                </div>
              </div>
            `).join("") : '<div class="empty">No critical gaps identified!</div>'}
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Gap Severity Distribution</h2>
            </div>
            <div style="display:flex;justify-content:center;margin-bottom:12px">
              <canvas id="ovDonut" width="220" height="220"></canvas>
            </div>
            <div style="display:flex;justify-content:center;gap:14px;font-size:12px">
              <span><span style="display:inline-block;width:10px;height:10px;background:#1F7A4D;border-radius:2px;margin-right:4px"></span>No Gap: ${ov.gapDistribution?.noGap || 0}</span>
              <span><span style="display:inline-block;width:10px;height:10px;background:#D9822B;border-radius:2px;margin-right:4px"></span>Minor (1-2): ${ov.gapDistribution?.minorGap || 0}</span>
              <span><span style="display:inline-block;width:10px;height:10px;background:#B3261E;border-radius:2px;margin-right:4px"></span>Critical (&ge;3): ${ov.gapDistribution?.criticalGap || 0}</span>
            </div>
          </div>
        </div>

        <div class="grid g2">
          <div class="card">
            <div class="card-header">
              <h2>Department Skill Gap Overview</h2>
            </div>
            <div class="tablewrap">
              <table>
                <thead>
                  <tr><th>Department</th><th>Headcount</th><th>Total Gaps</th><th>Avg Gap</th></tr>
                </thead>
                <tbody>
                  ${(ov.departmentOverview || []).map(d => `
                    <tr>
                      <td><strong>${esc(d.department)}</strong></td>
                      <td>${d.totalEmployees}</td>
                      <td>${d.gapCount > 0 ? `<span class="chip warn">${d.gapCount}</span>` : '<span class="chip ok">0</span>'}</td>
                      <td>${d.avgGap}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Employees Requiring Attention</h2>
              <button class="btn ghost small" data-act="go" data-view="directory">Directory &rarr;</button>
            </div>
            ${(ov.needsAttention || []).length ? ov.needsAttention.map(e => `
              <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line)">
                <div style="display:flex;align-items:center;gap:10px">
                  ${av(e.name, 28)}
                  <div>
                    <div style="font-weight:600;font-size:13px">${esc(e.name)}</div>
                    <div style="font-size:11px;color:var(--muted)">${esc(e.department)} &middot; ${esc(e.designation)}</div>
                  </div>
                </div>
                <div style="display:flex;align-items:center;gap:8px">
                  ${e.criticalGaps > 0 ? `<span class="chip bad">${e.criticalGaps} critical</span>` : ''}
                  <button class="btn small ghost" data-act="viewEmp" data-id="${e.id}">Profile</button>
                </div>
              </div>
            `).join("") : '<div class="empty">All employees on track!</div>'}
          </div>
        </div>
      `;
    },

    // B. Employee Directory
    directory: function() {
      const emps = S.employees || [];
      const depts = S.meta.departments || [];
      const desigs = S.meta.designations || [];
      const roles = S.meta.roles || [];

      return `
        <div class="section-head">
          <div>
            <h1>Workforce Employee Directory</h1>
            <p class="lead">Search, filter, and inspect skill profiles, knowledge gaps, and learning records across all employees.</p>
          </div>
        </div>

        <div class="filter-bar">
          <div class="search-box" style="flex:1;min-width:200px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input id="empSearch" placeholder="Search by name, email..." oninput="HR.filterDirectory()">
          </div>
          <select id="empDeptFilter" onchange="HR.filterDirectory()">
            <option value="">All Departments</option>
            ${depts.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join("")}
          </select>
          <select id="empDesigFilter" onchange="HR.filterDirectory()">
            <option value="">All Designations</option>
            ${desigs.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join("")}
          </select>
          <select id="empRoleFilter" onchange="HR.filterDirectory()">
            <option value="">All Roles</option>
            ${roles.map(r => `<option value="${r.id}">${esc(r.name)}</option>`).join("")}
          </select>
        </div>

        <div class="card">
          <div class="tablewrap">
            <table id="empTable">
              <thead>
                <tr>
                  <th>Employee</th>
                  <th>Department / Designation</th>
                  <th>System Role</th>
                  <th>Skills</th>
                  <th>Skill Gaps</th>
                  <th>Training Progress</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="empTableBody">
                ${HR.renderEmployeeRows(emps)}
              </tbody>
            </table>
          </div>
          <div style="font-size:12px;color:var(--muted);margin-top:10px;text-align:right" id="empCountLabel">
            Showing ${emps.length} employees
          </div>
        </div>
      `;
    },

    // C. Competency Framework
    competency: function() {
      const skills = S.skills || [];
      const cats = S.categories || [];

      return `
        <div class="section-head">
          <div>
            <h1>Competency Framework & Skills</h1>
            <p class="lead">Define standard organizational skills, categorize competencies, and set default proficiency benchmarks.</p>
          </div>
          <button class="btn" data-act="openAddSkillModal">+ Add New Skill</button>
        </div>

        <div class="grid g4" style="margin-bottom:18px">
          <div class="stat-tile accent-purple"><b>${skills.length}</b><span>Total Defined Skills</span></div>
          <div class="stat-tile accent-blue"><b>${cats.length}</b><span>Skill Categories</span></div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Skill Definitions & Benchmarks</h2>
            <div class="search-box" style="width:240px">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
              <input id="skillSearch" placeholder="Search skill or category..." oninput="HR.filterSkills()">
            </div>
          </div>
          <div class="tablewrap">
            <table>
              <thead>
                <tr>
                  <th>Skill Name</th>
                  <th>Category</th>
                  <th>Default Benchmark (1-5)</th>
                  <th>Employees Assessed</th>
                  <th>Avg Proficiency</th>
                  <th>Action</th>
                </tr>
              </thead>
              <tbody id="skillTableBody">
                ${skills.map(s => `
                  <tr>
                    <td><strong>${esc(s.skillName)}</strong></td>
                    <td><span class="chip">${esc(s.category)}</span></td>
                    <td>Level ${s.defaultRequiredLevel} / 5</td>
                    <td>${s.employeesCount} employee(s)</td>
                    <td><strong>${s.avgProficiency}</strong> / 5</td>
                    <td>
                      <button class="btn ghost small" data-act="editSkill" data-id="${s.skillId}" data-name="${esc(s.skillName)}" data-cat="${esc(s.category)}" data-lvl="${s.defaultRequiredLevel}">Edit</button>
                      <button class="btn danger small" data-act="deleteSkill" data-id="${s.skillId}">Delete</button>
                    </td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;
    },

    // D. Role Requirements
    roles: function() {
      const roles = S.roles || [];

      return `
        <div class="section-head">
          <div>
            <h1>Target Role Competency Requirements</h1>
            <p class="lead">Manage organizational target career paths, required skills per role, and expected proficiency levels.</p>
          </div>
          <button class="btn" data-act="openAddRoleModal">+ Create Target Role</button>
        </div>

        <div class="grid g2">
          ${roles.map(r => `
            <div class="card">
              <div class="card-header">
                <div>
                  <h2 style="font-size:17px">${esc(r.roleName)}</h2>
                  <p class="sub">${esc(r.description || 'Target career track')}</p>
                </div>
                <button class="btn ghost small" data-act="openAddRoleSkillModal" data-id="${r.roleId}" data-name="${esc(r.roleName)}">+ Add Skill</button>
              </div>
              <div class="tablewrap" style="margin-bottom:12px">
                <table>
                  <thead>
                    <tr><th>Skill</th><th>Req Level</th><th>Weight</th><th></th></tr>
                  </thead>
                  <tbody>
                    ${(r.skills || []).length ? (r.skills || []).map(sk => `
                      <tr>
                        <td><strong>${esc(sk.skillName)}</strong></td>
                        <td>Level ${sk.requiredLevel}</td>
                        <td>${sk.weightPct}%</td>
                        <td><button class="btn danger small" style="padding:2px 6px" data-act="delRoleSkill" data-roleid="${r.roleId}" data-skillid="${sk.skillId}">&times;</button></td>
                      </tr>
                    `).join("") : '<tr><td colspan="4" class="empty">No skills mapped yet.</td></tr>'}
                  </tbody>
                </table>
              </div>
              <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)">
                <span>${r.assignedEmployees || 0} employees targeting this role</span>
                <button class="btn danger small" data-act="deleteRole" data-id="${r.roleId}">Delete Role</button>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    },

    // E. Skill Gap Analysis
    gaps: function() {
      const g = S.gaps;
      if (!g) return '<div class="empty">Loading skill gap matrix…</div>';
      const skillsGaps = g.skillsGaps || [];

      return `
        <div class="section-head">
          <div>
            <h1>Organisation-Wide Skill Gap Analysis</h1>
            <p class="lead">In-depth intelligence comparing employee current proficiencies against organizational requirements.</p>
          </div>
        </div>

        <div class="grid g2" style="margin-bottom:18px">
          <div class="card">
            <div class="card-header">
              <h2>Skill Gap Radar Chart</h2>
            </div>
            <div style="display:flex;justify-content:center;height:260px">
              <canvas id="gapRadar" width="280" height="260"></canvas>
            </div>
            <div style="text-align:center;font-size:11px;color:var(--muted);margin-top:6px">
              Org Average Proficiency vs Maximum Target
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <h2>Top Affected Skills</h2>
            </div>
            <div style="display:flex;justify-content:center;height:260px">
              <canvas id="gapBar" width="340" height="260"></canvas>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h2>Detailed Competency Gap Matrix</h2>
          </div>
          <div class="tablewrap">
            <table>
              <thead>
                <tr>
                  <th>Skill</th>
                  <th>Category</th>
                  <th>Org Avg</th>
                  <th>Required Target</th>
                  <th>Avg Gap</th>
                  <th>Employees Affected</th>
                  <th>Severity</th>
                </tr>
              </thead>
              <tbody>
                ${skillsGaps.map(sk => `
                  <tr>
                    <td><strong>${esc(sk.skill)}</strong></td>
                    <td><span class="chip">${esc(sk.category)}</span></td>
                    <td>${sk.orgAvg} / 5</td>
                    <td>${sk.requiredLevel} / 5</td>
                    <td style="font-weight:700;color:var(--${sk.severity==='critical'?'bad':sk.severity==='medium'?'warn':'ok'})">-${sk.avgGap}</td>
                    <td><span class="chip ${sk.severity==='critical'?'bad':sk.severity==='medium'?'warn':'ok'}">${sk.employeesAffected} employee(s)</span></td>
                    <td><span class="chip ${sk.severity==='critical'?'bad':sk.severity==='medium'?'warn':'ok'}">${sk.severity.toUpperCase()}</span></td>
                  </tr>
                `).join("")}
              </tbody>
            </table>
          </div>
        </div>
      `;

          </td>
        </tr>
      `).join("");

    filterDirectory: function() {
      const q = (document.getElementById("empSearch")?.value || "").toLowerCase().trim();
      const d = document.getElementById("empDeptFilter")?.value || "";
      const ds = document.getElementById("empDesigFilter")?.value || "";
      const r = document.getElementById("empRoleFilter")?.value || "";

      const filtered = S.employees.filter(e => {
        if (q && !e.name.toLowerCase().includes(q) && !e.email.toLowerCase().includes(q)) return false;
        if (d && String(e.departmentId) !== d) return false;
        if (ds && String(e.designationId) !== ds) return false;
        if (r && String(e.roleId) !== r) return false;
        return true;
      });

      document.getElementById("empTableBody").innerHTML = HR.renderEmployeeRows(filtered);
      document.getElementById("empCountLabel").textContent = `Showing ${filtered.length} of ${S.employees.length} employees`;
    },

    filterSkills: function() {
      const q = (document.getElementById("skillSearch")?.value || "").toLowerCase().trim();
      const rows = document.querySelectorAll("#skillTableBody tr");
      rows.forEach(r => {
        const text = r.textContent.toLowerCase();
        r.style.display = text.includes(q) ? "" : "none";
      });
    },

              <tbody>
                ${(emp.courses || []).length ? (emp.courses || []).map(c => `
                  <tr>
                    <td>${esc(c.courseTitle)}</td>
                    <td>${c.progressPct}%</td>
                    <td><span class="chip ${c.status==='COMPLETED'?'ok':'warn'}">${esc(c.status)}</span></td>

                `).join("") : '<tr><td colspan="3" class="empty">No active courses.</td></tr>'}

        `;

    exportCSV: function() {
      const rows = [
        ["Employee ID", "Name", "Email", "Department", "Designation", "Total Skills", "Skill Gaps", "Critical Gaps", "Training Progress %"]
      ];
      (S.employees || []).forEach(e => {
        rows.push([
          e.id, `"${e.name}"`, e.email, `"${e.department}"`, `"${e.designation}"`,
          e.totalSkills, e.totalGaps, e.criticalGaps, e.trainingProgress
        ]);
      });
      const csv = rows.map(r => r.join(",")).join("\n");
      const blob = new Blob([csv], { type: "text/csv" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `HR_Workforce_Intelligence_Report_${new Date().toISOString().substring(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      toast("Report CSV downloaded");
    }
  };

  // =========================================================================
  // VIEW NAVIGATION & DATA LOADING
  // =========================================================================
  async function loadView(v) {
    currentView = v;
    document.querySelectorAll("nav#nav button[data-act='go']").forEach(btn => {
      btn.removeAttribute("aria-current");

      `;
      openModal("Broadcast HR Announcement", html);
      document.getElementById("submitBroadcastBtn").onclick = async () => {
        const title = document.getElementById("notifTitle").value.trim();
        const message = document.getElementById("notifMsg").value.trim();
        const targetType = document.getElementById("notifTargetType").value;
        let targetId = null;
        if (targetType === "DEPARTMENT") targetId = parseInt(document.getElementById("notifDeptId").value, 10);
        else if (targetType === "EMPLOYEE") targetId = parseInt(document.getElementById("notifEmpId").value, 10);

        if (!title || !message) return alert("Enter title and message");
        try {
          const res = await hrApi("/notifications/send", { method: "POST", body: { title, message, targetType, targetId } });
          closeModal();
          toast(`Announcement sent to ${res.recipientsCount} employees`);
          loadView("notifications");
        } catch (err) { toast(err.message, true); }
      };
    }
  });

  // =========================================================================
  // INITIALIZATION
  // =========================================================================
  (async function init() {
    try {
      S.meta = await hrApi("/meta");
    } catch (e) {
      console.warn("Meta fetch error:", e);
    }
    loadView("overview");
  })();
})();
</script>
</body>
</html>
